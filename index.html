<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PUBLIC CITY TWIN — 3D</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#9fb4c2;
    font-family:-apple-system,BlinkMacSystemFont,
                 "Noto Sans KR",sans-serif;
}

#renderCanvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

.ui{
    position:fixed;
    z-index:20;
    color:#fff;
    background:rgba(13,22,31,.90);
    border:1px solid rgba(255,255,255,.13);
    border-radius:15px;
    backdrop-filter:blur(14px);
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

#header{
    left:12px;
    right:12px;
    top:12px;
    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 16px;
}

.title{
    font-size:17px;
    font-weight:900;
}

.subtitle{
    margin-top:3px;
    font-size:9px;
    color:#aab8c6;
}

#time{
    font-size:12px;
    font-weight:900;
    color:#6ec0ff;
}

#controls{
    left:12px;
    top:88px;

    width:270px;
    max-height:calc(100% - 105px);

    overflow:auto;
    padding:14px;
}

.section{
    margin-bottom:17px;
}

.sectionTitle{
    color:#aebdca;
    font-size:10px;
    font-weight:900;
    margin-bottom:9px;
}

.control{
    margin-bottom:11px;
}

.controlTop{
    display:flex;
    justify-content:space-between;

    font-size:11px;
    margin-bottom:4px;
}

.controlTop b{
    color:#67baff;
}

input[type=range]{
    width:100%;
    accent-color:#3f9de0;
}

button{
    width:100%;
    min-height:39px;

    border:0;
    border-radius:9px;

    background:#263b4e;
    color:#fff;

    font-weight:800;

    margin:3px 0;
}

button.primary{
    background:#287fbf;
}

button.green{
    background:#197452;
}

button.orange{
    background:#8e6227;
}

#metrics{
    right:12px;
    bottom:12px;

    width:260px;

    padding:13px;
}

.metricGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.metric{
    padding:8px;
    border-radius:9px;
    background:rgba(255,255,255,.055);
}

.metric span{
    display:block;
    color:#91a2b2;
    font-size:9px;
}

.metric strong{
    display:block;
    margin-top:2px;
    font-size:15px;
}

#mode{
    left:50%;
    bottom:12px;
    transform:translateX(-50%);

    width:230px;

    padding:6px;

    display:flex;
    gap:5px;
}

#mode button{
    margin:0;
}

#joystick{
    display:none;

    position:fixed;
    z-index:30;

    left:18px;
    bottom:20px;

    width:125px;
    height:125px;

    border-radius:50%;

    background:rgba(0,0,0,.20);
    border:2px solid rgba(255,255,255,.28);
}

#stick{
    position:absolute;

    width:48px;
    height:48px;

    left:36px;
    top:36px;

    border-radius:50%;

    background:rgba(65,160,225,.9);
}

#info{
    display:none;

    right:12px;
    top:88px;

    width:270px;

    padding:14px;
}

#infoName{
    font-size:16px;
    font-weight:900;
}

#infoType{
    color:#65baff;
    font-size:10px;
    margin-top:3px;
}

#infoText{
    margin-top:9px;

    color:#c1ccd5;

    font-size:10px;
    line-height:1.6;
}

#toast{
    display:none;

    position:fixed;
    z-index:50;

    left:50%;
    top:82px;

    transform:translateX(-50%);

    padding:9px 14px;

    border-radius:9px;

    background:rgba(8,18,28,.94);

    color:white;

    font-size:11px;
    font-weight:800;
}

#error{
    display:none;

    position:fixed;
    z-index:100;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(90%,430px);

    padding:22px;

    background:#172330;
    color:white;

    border-radius:16px;

    text-align:center;

    line-height:1.6;
}

@media(max-width:700px){

    #controls{
        width:225px;
    }

    #metrics{
        width:205px;
    }

    .title{
        font-size:14px;
    }
}

</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>


<div id="header" class="ui">

    <div>

        <div class="title">
            PUBLIC CITY TWIN
        </div>

        <div class="subtitle">
            2차 공공기관 이전 · 기능·산업 중심 3D 디지털 트윈
        </div>

    </div>

    <div id="time">
        현재 도시
    </div>

</div>


<div id="controls" class="ui">

    <div class="section">

        <div class="sectionTitle">
            도시 정책 변수
        </div>


        <div class="control">

            <div class="controlTop">
                <span>공공기관 집적도</span>
                <b id="v1">70</b>
            </div>

            <input
                id="s1"
                type="range"
                min="0"
                max="100"
                value="70"
            >

        </div>


        <div class="control">

            <div class="controlTop">
                <span>산업 연계성</span>
                <b id="v2">65</b>
            </div>

            <input
                id="s2"
                type="range"
                min="0"
                max="100"
                value="65"
            >

        </div>


        <div class="control">

            <div class="controlTop">
                <span>대학·연구 역량</span>
                <b id="v3">55</b>
            </div>

            <input
                id="s3"
                type="range"
                min="0"
                max="100"
                value="55"
            >

        </div>


        <div class="control">

            <div class="controlTop">
                <span>정주 환경</span>
                <b id="v4">60</b>
            </div>

            <input
                id="s4"
                type="range"
                min="0"
                max="100"
                value="60"
            >

        </div>


        <div class="control">

            <div class="controlTop">
                <span>교통 접근성</span>
                <b id="v5">60</b>
            </div>

            <input
                id="s5"
                type="range"
                min="0"
                max="100"
                value="60"
            >

        </div>


        <div class="control">

            <div class="controlTop">
                <span>초기 기업 기반</span>
                <b id="v6">35</b>
            </div>

            <input
                id="s6"
                type="range"
                min="0"
                max="100"
                value="35"
            >

        </div>

    </div>


    <div class="section">

        <div class="sectionTitle">
            도시 전략
        </div>

        <button
            class="primary"
            onclick="preset(75,70,65,75,70,50)"
        >
            균형형 도시
        </button>

        <button
            onclick="preset(80,95,75,55,65,80)"
        >
            산업 클러스터형
        </button>

        <button
            onclick="preset(65,55,60,95,75,40)"
        >
            정주 우선형
        </button>

        <button
            onclick="preset(70,65,60,70,98,45)"
        >
            교통 거점형
        </button>

    </div>


    <div class="section">

        <div class="sectionTitle">
            시뮬레이션
        </div>

        <button
            class="green"
            onclick="runSimulation()"
        >
            ▶ 20년 시뮬레이션
        </button>

        <button
            class="orange"
            onclick="resetSimulation()"
        >
            ↻ 초기화
        </button>

    </div>

</div>


<div id="info" class="ui">

    <div id="infoName"></div>

    <div id="infoType"></div>

    <div id="infoText"></div>

</div>


<div id="metrics" class="ui">

    <div class="sectionTitle">
        도시 성과
    </div>

    <div class="metricGrid">

        <div class="metric">
            <span>정주인구</span>
            <strong id="population">52.0만</strong>
        </div>

        <div class="metric">
            <span>연계기업</span>
            <strong id="companies">350</strong>
        </div>

        <div class="metric">
            <span>일자리</span>
            <strong id="jobs">12.4만</strong>
        </div>

        <div class="metric">
            <span>상권 활성도</span>
            <strong id="commercial">63%</strong>
        </div>

        <div class="metric">
            <span>산학협력</span>
            <strong id="cooperation">48%</strong>
        </div>

        <div class="metric">
            <span>정착률</span>
            <strong id="settlement">61%</strong>
        </div>

    </div>

</div>


<div id="mode" class="ui">

    <button onclick="overview()">
        조감도
    </button>

    <button onclick="walkMode()">
        도시 진입
    </button>

</div>


<div id="joystick">

    <div id="stick"></div>

</div>


<div id="toast"></div>


<div id="error">

    <strong>3D 엔진을 불러오지 못했습니다.</strong>

    <br><br>

    인터넷 연결을 확인한 뒤 페이지를 새로고침해주세요.

</div>


<!-- ========================================================
     Babylon.js
     ========================================================

     이전 Canvas 방식과 달리 실제 3D 엔진 사용.
========================================================= -->

<script src="https://cdn.babylonjs.com/babylon.js"></script>


<script>

/* =========================================================
   ENGINE
========================================================= */

const canvas=
    document.getElementById(
        "renderCanvas"
    );


if(
    typeof BABYLON==="undefined"
){

    document.getElementById(
        "error"
    ).style.display="block";

    throw new Error(
        "Babylon.js unavailable"
    );
}


const engine=
    new BABYLON.Engine(
        canvas,
        true,
        {
            preserveDrawingBuffer:true,
            stencil:true
        }
    );


/* =========================================================
   SCENE
========================================================= */

const scene=
    new BABYLON.Scene(
        engine
    );


scene.clearColor=
    new BABYLON.Color4(
        .55,
        .67,
        .74,
        1
    );


/* =========================================================
   CAMERA
========================================================= */

const camera=
    new BABYLON.ArcRotateCamera(

        "cityCamera",

        -Math.PI/4,

        Math.PI/3.1,

        330,

        new BABYLON.Vector3(
            0,
            0,
            0
        ),

        scene
    );


camera.attachControl(
    canvas,
    true
);


camera.lowerRadiusLimit=65;
camera.upperRadiusLimit=500;

camera.lowerBetaLimit=.2;
camera.upperBetaLimit=1.45;


/* =========================================================
   LIGHTING
========================================================= */

const sun=
    new BABYLON.DirectionalLight(

        "sun",

        new BABYLON.Vector3(
            -0.5,
            -1,
            -0.35
        ),

        scene
    );


sun.position=
    new BABYLON.Vector3(
        150,
        250,
        120
    );


sun.intensity=2.1;


const ambient=
    new BABYLON.HemisphericLight(

        "ambient",

        new BABYLON.Vector3(
            0,
            1,
            0
        ),

        scene
    );


ambient.intensity=.75;


/* =========================================================
   SHADOW
========================================================= */

const shadowGenerator=
    new BABYLON.ShadowGenerator(
        2048,
        sun
    );


shadowGenerator.useBlurExponentialShadowMap=true;

shadowGenerator.blurKernel=24;


/* =========================================================
   MATERIALS
========================================================= */

function material(
    name,
    color,
    roughness=.65
){

    const m=
        new BABYLON.PBRMaterial(
            name,
            scene
        );


    m.albedoColor=
        BABYLON.Color3.FromHexString(
            color
        );


    m.roughness=roughness;

    m.metallic=0;


    return m;
}


const mats={

    public:
        material(
            "PublicConcrete",
            "#5B82A4",
            .48
        ),

    research:
        material(
            "ResearchGlass",
            "#607F99",
            .25
        ),

    university:
        material(
            "UniversityStone",
            "#7B6B91",
            .58
        ),

    residential:
        material(
            "Apartment",
            "#A4ADB0",
            .72
        ),

    commercial:
        material(
            "Commercial",
            "#A8784F",
            .55
        ),

    industry:
        material(
            "Industry",
            "#737B80",
            .78
        ),

    road:
        material(
            "Road",
            "#353A3E",
            .92
        ),

    sidewalk:
        material(
            "Sidewalk",
            "#A7A9A5",
            .9
        ),

    grass:
        material(
            "Grass",
            "#4D7E51",
            1
        ),

    glass:
        material(
            "Glass",
            "#6C9FB9",
            .08
        ),

    white:
        material(
            "White",
            "#E5E7E7",
            .7
        ),

    black:
        material(
            "Black",
            "#151719",
            .82
        ),

    tree:
        material(
            "Tree",
            "#3C7043",
            1
        ),

    trunk:
        material(
            "Trunk",
            "#65452C",
            1
        )

};


/* =========================================================
   GROUND
========================================================= */

const ground=
    BABYLON.MeshBuilder.CreateGround(
        "cityGround",
        {
            width:420,
            height:420,
            subdivisions:4
        },
        scene
    );


ground.material=
    mats.grass;


/* =========================================================
   CITY DATA
========================================================= */

const buildings=[];
const vehicles=[];
const trees=[];
const parks=[];


/* =========================================================
   ROAD
========================================================= */

function createRoad(
    x,
    z,
    width,
    depth
){

    const road=
        BABYLON.MeshBuilder.CreateBox(
            "road",
            {
                width,
                height:.12,
                depth
            },
            scene
        );


    road.position.x=x;
    road.position.z=z;
    road.position.y=.06;

    road.material=
        mats.road;
}


/* =========================================================
   SIDEWALK
========================================================= */

function sidewalk(
    x,
    z,
    width,
    depth
){

    const s=
        BABYLON.MeshBuilder.CreateBox(
            "sidewalk",
            {
                width,
                height:.18,
                depth
            },
            scene
        );


    s.position.set(
        x,
        .13,
        z
    );


    s.material=
        mats.sidewalk;
}


/* =========================================================
   ROAD NETWORK
========================================================= */

function createRoadNetwork(){

    for(
        let i=-4;
        i<=4;
        i++
    ){

        const z=i*35;


        createRoad(
            0,
            z,
            420,
            10
        );


        sidewalk(
            0,
            z-6.4,
            420,
            1.8
        );


        sidewalk(
            0,
            z+6.4,
            420,
            1.8
        );
    }


    for(
        let i=-4;
        i<=4;
        i++
    ){

        const x=i*35;


        createRoad(
            x,
            0,
            10,
            420
        );


        sidewalk(
            x-6.4,
            0,
            1.8,
            420
        );


        sidewalk(
            x+6.4,
            0,
            1.8,
            420
        );
    }
}


createRoadNetwork();


/* =========================================================
   ROAD MARKINGS
========================================================= */

function createRoadMarkings(){

    for(
        let i=-4;
        i<=4;
        i++
    ){

        const z=i*35;


        for(
            let x=-195;
            x<195;
            x+=13
        ){

            const line=
                BABYLON.MeshBuilder.CreateBox(
                    "roadLine",
                    {
                        width:7,
                        height:.14,
                        depth:.35
                    },
                    scene
                );


            line.position.set(
                x,
                .14,
                z
            );


            line.material=
                mats.white;
        }
    }


    for(
        let i=-4;
        i<=4;
        i++
    ){

        const x=i*35;


        for(
            let z=-195;
            z<195;
            z+=13
        ){

            const line=
                BABYLON.MeshBuilder.CreateBox(
                    "roadLine",
                    {
                        width:.35,
                        height:.14,
                        depth:7
                    },
                    scene
                );


            line.position.set(
                x,
                .14,
                z
            );


            line.material=
                mats.white;
        }
    }
}


createRoadMarkings();


/* =========================================================
   BUILDING
========================================================= */

function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    type,
    name
){

    const body=
        BABYLON.MeshBuilder.CreateBox(
            name,
            {
                width,
                height,
                depth
            },
            scene
        );


    body.position.set(
        x,
        height/2,
        z
    );


    body.material=
        mats[type];


    shadowGenerator.addShadowCaster(
        body
    );


    /*
       건물 데이터
    */

    const data={

        mesh:body,

        x,
        z,

        width,
        depth,
        height,

        type,
        name
    };


    buildings.push(data);


    /*
       창문
    */

    createWindows(
        data
    );


    /*
       지붕
    */

    createRoof(
        data
    );


    /*
       건물 입구
    */

    if(
        type==="public" ||
        type==="university" ||
        type==="commercial"
    ){

        createEntrance(
            data
        );
    }


    return data;
}


/* =========================================================
   WINDOWS
========================================================= */

function createWindows(b){

    if(
        b.type==="industry"
    )
        return;


    const windowMaterial=
        mats.glass;


    const floors=
        Math.min(
            12,
            Math.max(
                2,
                Math.floor(
                    b.height/6
                )
            )
        );


    const columns=
        Math.min(
            8,
            Math.max(
                3,
                Math.floor(
                    b.width/4
                )
            )
        );


    for(
        let f=0;
        f<floors;
        f++
    ){

        const y=
            3+
            f*
            (
                b.height/
                (floors+1)
            );


        for(
            let c=0;
            c<columns;
            c++
        ){

            const x=
                b.x-
                b.width/2+
                2+
                c*
                (
                    (b.width-4)/
                    Math.max(
                        1,
                        columns-1
                    )
                );


            /*
               앞면 창
            */

            const w=
                BABYLON.MeshBuilder.CreateBox(
                    "window",
                    {
                        width:1.4,
                        height:1.7,
                        depth:.08
                    },
                    scene
                );


            w.position.set(
                x,
                y,
                b.z-
                b.depth/2-
                .045
            );


            w.material=
                windowMaterial;
        }
    }


    /*
       옆면 창
    */

    const sideRows=
        Math.min(
            7,
            Math.floor(
                b.depth/4
            )
        );


    for(
        let f=0;
        f<floors;
        f++
    ){

        const y=
            3+
            f*
            (
                b.height/
                (floors+1)
            );


        for(
            let r=0;
            r<sideRows;
            r++
        ){

            const z=
                b.z-
                b.depth/2+
                2+
                r*
                (
                    (b.depth-4)/
                    Math.max(
                        1,
                        sideRows-1
                    )
                );


            const w=
                BABYLON.MeshBuilder.CreateBox(
                    "sideWindow",
                    {
                        width:.08,
                        height:1.7,
                        depth:1.3
                    },
                    scene
                );


            w.position.set(
                b.x+
                b.width/2+
                .045,
                y,
                z
            );


            w.material=
                windowMaterial;
        }
    }
}


/* =========================================================
   ROOF
========================================================= */

function createRoof(b){

    const roof=
        BABYLON.MeshBuilder.CreateBox(
            "roof",
            {
                width:b.width+1.5,
                height:.5,
                depth:b.depth+1.5
            },
            scene
        );


    roof.position.set(
        b.x,
        b.height+.25,
        b.z
    );


    roof.material=
        mats.black;


    shadowGenerator.addShadowCaster(
        roof
    );
}


/* =========================================================
   ENTRANCE
========================================================= */

function createEntrance(b){

    const entrance=
        BABYLON.MeshBuilder.CreateBox(
            "entrance",
            {
                width:Math.min(
                    7,
                    b.width*.5
                ),
                height:3.4,
                depth:.25
            },
            scene
        );


    entrance.position.set(
        b.x,
        1.7,
        b.z-b.depth/2-.15
    );


    entrance.material=
        mats.glass;
}


/* =========================================================
   SPECIAL BUILDINGS
========================================================= */

function createPublicHQ(){

    const b=
        createBuilding(
            0,
            0,
            38,
            27,
            65,
            "public",
            "통합 공공기관 본청"
        );


    /*
       중앙 유리 아트리움
    */

    const atrium=
        BABYLON.MeshBuilder.CreateBox(
            "atrium",
            {
                width:16,
                height:58,
                depth:8
            },
            scene
        );


    atrium.position.set(
        0,
        29,
        -14
    );

/* =========================================================
   WALK CAMERA ROTATION
========================================================= */

let dragging=false;

let lastX=0;

let lastY=0;


canvas.addEventListener(
    "pointerdown",
    e=>{

        if(
            mode!=="walk"
        )
            return;


        dragging=true;

        lastX=e.clientX;

        lastY=e.clientY;
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(
            !dragging ||
            mode!=="walk"
        )
            return;


        const dx=
            e.clientX-lastX;


        const dy=
            e.clientY-lastY;


        lastX=e.clientX;

        lastY=e.clientY;


        camera.rotation.y+=
            dx*.004;


        camera.rotation.x+=
            dy*.002;


        camera.rotation.x=
            Math.max(
                -.8,
                Math.min(
                    .8,
                    camera.rotation.x
                )
            );
    }
);


canvas.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );


let joyX=0;

let joyY=0;

let joyActive=false;


joystick.addEventListener(
    "pointerdown",
    e=>{

        joyActive=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        moveJoystick(e);
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            joyActive
        )
            moveJoystick(e);
    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


function moveJoystick(e){

    const r=
        joystick.getBoundingClientRect();


    let x=
        e.clientX-
        (
            r.left+
            r.width/2
        );


    let y=
        e.clientY-
        (
            r.top+
            r.height/2
        );


    const max=39;

    const len=
        Math.hypot(
            x,
            y
        );


    if(
        len>max
    ){

        x=
            x/len*
            max;

        y=
            y/len*
            max;
    }


    joyX=x/max;

    joyY=y/max;


    stick.style.left=
        36+x+"px";

    stick.style.top=
        36+y+"px";
}


function resetJoystick(){

    joyActive=false;

    joyX=0;

    joyY=0;

    stick.style.left="36px";

    stick.style.top="36px";
}


/* =========================================================
   WALK MOVEMENT
=========================================================

   ★ 핵심 수정

   조이스틱을 위로 밀면
   카메라가 바라보는 방향으로 전진.

   이전 코드의 -jy 반전 제거.
========================================================= */

setInterval(
    ()=>{

        if(
            mode!=="walk"
        )
            return;


        const speed=1.35;


        /*
           전진
        */

        const forward=
            new BABYLON.Vector3(
                Math.sin(
                    camera.rotation.y
                ),
                0,
                Math.cos(
                    camera.rotation.y
                )
            );


        /*
           오른쪽
        */

        const right=
            new BABYLON.Vector3(
                Math.cos(
                    camera.rotation.y
                ),
                0,
                -Math.sin(
                    camera.rotation.y
                )
            );


        /*
           ★ 위로 밀기 = 전진

           joyY < 0
        */

        camera.position=
            camera.position.add(
                forward.scale(
                    -joyY*
                    speed
                )
            );


        camera.position=
            camera.position.add(
                right.scale(
                    joyX*
                    speed
                )
            );


        camera.position.y=4;


        /*
           도시 범위 제한
        */

        camera.position.x=
            Math.max(
                -195,
                Math.min(
                    195,
                    camera.position.x
                )
            );


        camera.position.z=
            Math.max(
                -195,
                Math.min(
                    195,
                    camera.position.z
                )
            );

    },
    30
);

scene.onPointerObservable.add(
    pointerInfo=>{

        if(
            pointerInfo.type !==
            BABYLON.PointerEventTypes.POINTERPICK
        )
            return;


        const picked=
            pointerInfo.pickInfo;


        if(
            !picked.hit
        )
            return;


        const mesh=
            picked.pickedMesh;


        const b=
            buildings.find(
                x=>
                    x.mesh===mesh
            );


        if(b)
            showBuilding(b);
    }
);

/* =========================================================

========================================================= */

function updateMetrics(){

    const [
        institution,
        industry,
        research,
        settlement,
        transport,
        firms
    ]=
        getValues();


    const strength=

        institution*.18+
        industry*.22+
        research*.15+
        settlement*.18+
        transport*.15+
        firms*.12;


    state.population=
        32+
        strength*.43;


    state.companies=
        120+
        industry*3+
        research*1.5+
        firms*2;


    state.jobs=
        5+
        state.companies*.17+
        strength*.15;


    state.commercial=
        settlement*.4+
        transport*.2+
        industry*.2+
        institution*.1+
        research*.1;


    state.cooperation=
        research*.55+
        industry*.25+
        institution*.2;


    state.settlement=
        settlement*.55+
        transport*.2+
        institution*.1+
        research*.15;


    displayMetrics();
}

function preset(

/* =========================================================
   SIMULATION
========================================================= */

let simulationTimer=null;


function runSimulation(){

    if(
        simulationTimer
    )
        clearInterval(
            simulationTimer
        );


    let year=0;


    simulationTimer=
        setInterval(
            ()=>{

                year++;


                state.year=year;


                document.getElementById(
                    "time"
                ).textContent=
                    year+
                    "년차";


                const [
                    a,b,c,d,e,f
                ]=
                    getValues();


                const strength=
                    (
                        a+b+c+d+e+f
                    )/600;


                state.population=
                    42+
                    strength*18+
                    year*
                    strength*.35;


                state.companies=
                    180+
                    strength*220+
                    year*
                    strength*13;


                state.jobs=
                    7+
                    strength*4+
                    year*
                    strength*.15;


                state.commercial=
                    Math.min(
                        100,
                        45+
                        strength*35+
                        year*
                        strength*.7
                    );


                state.cooperation=
                    Math.min(
                        100,
                        40+
                        strength*35+
                        year*.8
                    );


                state.settlement=
                    Math.min(
                        100,
                        45+
                        strength*30+
                        year*.5
                    );


                displayMetrics();


                if(
                    year>=20
                ){

                    clearInterval(
                        simulationTimer
                    );


                    state.coexistenceIndex=
                        calculateCoexistenceIndex(
                            state
                        );


                    toast(
                        "20년 시뮬레이션 완료 · 상생지수 "+
                        state.coexistenceIndex.toFixed(
                            1
                        )
                    );
                }

            },
            180
        );
}


/* =========================================================
   COEXISTENCE INDEX
=========================================================

   ★ 나중에 네가 실제 상생지수 공식을 주면
     이 함수만 교체하면 됨.
========================================================= */

function calculateCoexistenceIndex(s){

    const score=

        s.commercial*.20+

        s.cooperation*.30+

        s.settlement*.20+

        Math.min(
            100,
            s.companies/6
        )*.15+

        Math.min(
            100,
            s.jobs*5
        )*.15;


    return Math.max(
        0,
        Math.min(
            100,
            score
        )
    );
}
