<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PUBLIC CITY TWIN</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#9caeb7;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
}

#renderCanvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

#topbar{
    position:fixed;
    z-index:20;
    top:12px;
    left:12px;
    right:12px;

    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 16px;

    color:white;

    background:rgba(17,25,32,.88);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
}

.title{
    font-size:15px;
    font-weight:900;
}

.subtitle{
    margin-top:3px;
    font-size:9px;
    color:#aab7c0;
}

#mode{
    font-size:11px;
    font-weight:900;
    color:#65baf0;
}

.panel{
    position:fixed;
    z-index:20;

    color:white;

    background:rgba(17,25,32,.88);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;

    box-shadow:0 12px 35px rgba(0,0,0,.2);
}

#policy{
    top:82px;
    left:12px;

    width:270px;
    max-height:calc(100% - 96px);

    overflow:auto;

    padding:14px;
}

.section{
    margin-bottom:14px;
}

.section-title{
    margin-bottom:9px;

    font-size:10px;
    font-weight:900;

    color:#aebbc5;
}

.slider{
    margin-bottom:10px;
}

.slider-row{
    display:flex;
    justify-content:space-between;

    font-size:10px;
}

.slider-row b{
    color:#61b8ef;
}

input[type=range]{
    width:100%;
    accent-color:#4ba8df;
}

button{
    width:100%;
    min-height:40px;

    margin:3px 0;

    border:0;
    border-radius:9px;

    color:white;

    background:#2d414f;

    font-weight:800;
}

button.primary{
    background:#287eae;
}

button.green{
    background:#197250;
}

button.orange{
    background:#815d2e;
}

#stats{
    position:fixed;
    z-index:20;

    right:12px;
    bottom:12px;

    width:280px;

    padding:13px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.stat{
    padding:8px;

    border-radius:9px;

    background:rgba(255,255,255,.055);
}

.stat small{
    display:block;

    color:#91a1ac;

    font-size:8px;
}

.stat strong{
    display:block;

    margin-top:2px;

    font-size:15px;
}

#viewButtons{
    position:fixed;
    z-index:25;

    left:50%;
    bottom:12px;

    transform:translateX(-50%);

    display:flex;
    gap:6px;

    width:250px;
}

#viewButtons button{
    margin:0;
}

#joystick{
    display:none;

    position:fixed;
    z-index:30;

    left:18px;
    bottom:25px;

    width:132px;
    height:132px;

    border-radius:50%;

    background:rgba(0,0,0,.25);

    border:2px solid rgba(255,255,255,.25);

    touch-action:none;
}

#stick{
    position:absolute;

    width:48px;
    height:48px;

    left:40px;
    top:40px;

    border-radius:50%;

    background:rgba(65,164,225,.9);
}

#buildingInfo{
    display:none;

    position:fixed;
    z-index:30;

    right:12px;
    top:82px;

    width:280px;

    padding:14px;

    color:white;

    background:rgba(17,25,32,.92);
    backdrop-filter:blur(15px);

    border-radius:14px;

    border:1px solid rgba(255,255,255,.15);
}

#buildingName{
    font-size:17px;
    font-weight:900;
}

#buildingType{
    margin-top:4px;

    color:#65baf0;

    font-size:10px;
    font-weight:800;
}

#buildingDescription{
    margin-top:9px;

    color:#c1ccd3;

    font-size:10px;
    line-height:1.6;
}

#toast{
    display:none;

    position:fixed;
    z-index:100;

    left:50%;
    top:80px;

    transform:translateX(-50%);

    padding:9px 14px;

    border-radius:9px;

    background:rgba(12,20,27,.95);

    color:white;

    font-size:11px;
    font-weight:800;
}

@media(max-width:700px){

    #policy{
        width:225px;
    }

    #stats{
        width:215px;
    }
}
</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>


<div id="topbar">

    <div>
        <div class="title">
            PUBLIC CITY TWIN
        </div>

        <div class="subtitle">
            2차 공공기관 이전 · 기능·산업 중심 도시 디지털 트윈

</div>

        <div class="slider">

                id="s2"

        <div class="slider">

            <div class="slider-row">

            </div>

            <input
                id="s3"
                type="range"
                min="0"

        <div class="slider">

        </div>


        <div class="slider">

            <input
                id="s6"

    </div>


    <div class="section">

        <div class="section-title">

        <button onclick="applyPreset(

        </button>

        <button onclick="applyPreset(

        </button>

        <button onclick="applyPreset(

        <button onclick="applyPreset(

    </div>

</div>


<div id="buildingInfo">

    <div id="buildingName"></div>

    <div id="buildingType"></div>

    <div id="buildingDescription"></div>

</div>


<div id="stats" class="panel">

    <div class="section-title">

    </div>

    <div class="grid">

        <div class="stat">
            <small>정주인구</small>
            <strong id="population">52.0만</strong>
        </div>

        <div class="stat">
            <small>연계기업</small>

        </div>

        <div class="stat">

        </div>

        </div>

<!--
==========================================================
ENGINE
==========================================================

이 버전은 Babylon.js를 사용한다.

최종적으로 실제 GLB/GLTF 건물을 넣을 때
SceneLoader.ImportMeshAsync를 이용한다.

현재 외부 라이브러리를 사용하므로
인터넷 연결이 필요하다.
==========================================================
-->

<script src="https://cdn.babylonjs.com/babylon.js"></script>


<script>

/* =========================================================
   ENGINE
========================================================= */

const canvas =
    document.getElementById(
        "renderCanvas"
    );

const engine =
    new BABYLON.Engine(
        canvas,
        true,
        {
            antialias:true,
            adaptToDeviceRatio:true
        }
    );

const scene =
    new BABYLON.Scene(engine);


/* =========================================================
   WORLD
========================================================= */

scene.clearColor =
    new BABYLON.Color4(
        .60,
        .71,
        .78,
        1
    );


/* =========================================================
   LIGHT
========================================================= */

const sun =
    new BABYLON.DirectionalLight(
        "sun",
        new BABYLON.Vector3(
            -.45,
            -1,
            -.35
        ),
        scene
    );

sun.position =
    new BABYLON.Vector3(
        250,
        300,
        180
    );

sun.intensity=2.0;


const skyLight =
    new BABYLON.HemisphericLight(
        "skyLight",
        new BABYLON.Vector3(
            0,
            1,
            0
        ),
        scene
    );

skyLight.intensity=.75;


/* =========================================================
   SHADOW
========================================================= */

const shadowGenerator =
    new BABYLON.ShadowGenerator(
        2048,
        sun
    );

shadowGenerator.useBlurExponentialShadowMap=true;

shadowGenerator.blurKernel=24;


/* =========================================================
   MATERIAL
========================================================= */

function material(
    name,
    color,
    roughness=.75,
    metallic=0
){

    const m =
        new BABYLON.PBRMaterial(
            name,
            scene
        );

    m.albedoColor =
        BABYLON.Color3.FromHexString(
            color
        );

    m.roughness=roughness;

    m.metallic=metallic;

    return m;
}


const MAT={

    asphalt:
        material(
            "asphalt",
            "#34383B",
            .95
        ),

    sidewalk:
        material(
            "sidewalk",
            "#9B9D9B",
            .9
        ),

    grass:
        material(
            "grass",
            "#55794E",
            1
        ),

    soil:
        material(
            "soil",
            "#756148",
            1
        ),

    public:
        material(
            "public",
            "#687D8D",
            .48
        ),

    office:
        material(
            "office",
            "#737D82",
            .5
        ),

    glass:
        material(
            "glass",
            "#4E819C",
            .08
        ),

    old:
        material(
            "old",
            "#88776A",
            .85
        ),

    brick:
        material(
            "brick",
            "#835C4E",
            .9
        ),

    residential:
        material(
            "residential",
            "#A2A7A5",
            .78
        ),

    commercial:
        material(
            "commercial",
            "#A17D5C",
            .65
        ),

    industrial:
        material(
            "industrial",
            "#6D7475",
            .9
        ),

    roof:
        material(
            "roof",
            "#292D2F",
            .9
        ),

    tree:
        material(
            "tree",
            "#3D6840",
            1
        ),

    trunk:
        material(
            "trunk",
            "#61452F",
            1
        ),

    white:
        material(
            "white",
            "#E2E1DD",
            .72
        ),

    yellow:
        material(
            "yellow",
            "#D1B64D",
            .6
        )
};


/* =========================================================
   GROUND
========================================================= */

const ground =
    BABYLON.MeshBuilder.CreateGround(
        "world",
        {
            width:900,
            height:900,
            subdivisions:12
        },
        scene
    );

ground.material=MAT.grass;


/* =========================================================
   CITY ZONES
=========================================================

   월드를 다음처럼 만든다.

        시골 / 산림
             ↓
        농촌 / 마을
             ↓
        외곽 주거
             ↓
        구도심
             ↓
        중심도심
             ↓
        공공기관
             ↓
        신도시
             ↓
        산업지구

   즉 어디로 이동해도 다른 지역이 이어진다.
========================================================= */


/* =========================================================
   ROAD
========================================================= */

function makeRoad(
    x,
    z,
    width,
    depth
){

    const road =
        BABYLON.MeshBuilder.CreateBox(
            "road",
            {
                width,
                depth,
                height:.12
            },
            scene
        );

    road.position.set(
        x,
        .06,
        z
    );

    road.material=MAT.asphalt;


    return road;
}


/* =========================================================
   SIDEWALK
========================================================= */

function makeSidewalk(
    x,
    z,
    width,
    depth
){

    const s =
        BABYLON.MeshBuilder.CreateBox(
            "sidewalk",
            {
                width,
                depth,
                height:.18
            },
            scene
        );

    s.position.set(
        x,
        .14,
        z
    );

    s.material=MAT.sidewalk;
}


/* =========================================================
   MAIN ROAD NETWORK
========================================================= */

for(
    let p=-8*45;
    p<=8*45;
    p+=45
){

    makeRoad(
        0,
        p,
        900,
        11
    );

    makeSidewalk(
        0,
        p-7,
        900,
        2
    );

    makeSidewalk(
        0,
        p+7,
        900,
        2
    );


    makeRoad(
        p,
        0,
        11,
        900
    );

    makeSidewalk(
        p-7,
        0,
        2,
        900
    );

    makeSidewalk(
        p+7,
        0,
        2,
        900
    );
}


/* =========================================================
   ROAD MARKING
========================================================= */

function roadMarking(
    x,
    z,
    horizontal=true
){

    const line =
        BABYLON.MeshBuilder.CreateBox(
            "roadLine",
            horizontal
            ?
            {
                width:6,
                depth:.22,
                height:.035
            }
            :
            {
                width:.22,
                depth:6,
                height:.035
            },
            scene
        );

    line.position.set(
        x,
        .14,
        z
    );

    line.material=MAT.white;
}


for(
    let p=-8*45;
    p<=8*45;
    p+=45
){

    for(
        let x=-430;
        x<430;
        x+=13
    ){

        roadMarking(
            x,
            p,
            true
        );
    }


    for(
        let z=-430;
        z<430;
        z+=13
    ){

        roadMarking(
            p,
            z,
            false
        );
    }
}


/* =========================================================
   BUILDING STORAGE
========================================================= */

const buildings=[];


/* =========================================================
   DETAILED BUILDING
========================================================= */

function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    type,
    name
){

    const body =
        BABYLON.MeshBuilder.CreateBox(
            name,
            {
                width,
                depth,
                height
            },
            scene
        );

    body.position.set(
        x,
        height/2,
        z
    );

    body.material=
        MAT[type] ||
        MAT.office;


    shadowGenerator
        .addShadowCaster(
            body
        );


    buildings.push({
        mesh:body,
        x,
        z,
        width,
        depth,
        height,
        type,
        name
    });


    /*
       옥상
    */

    const roof =
        BABYLON.MeshBuilder.CreateBox(
            "roof",
            {
                width:width+1,
                depth:depth+1,
                height:.35
            },
            scene
        );

    roof.position.set(
        x,
        height+.17,
        z
    );

    roof.material=MAT.roof;


    /*
       창문

       모든 건물을 단순 박스가 아니라
       입면을 가진 건물처럼 보이게 한다.
    */

    if(
        width>10 &&
        depth>10
    ){

        const floors=
            Math.max(
                1,
                Math.floor(
                    height/4
                )
            );


        const cols=
            Math.max(
                2,
                Math.floor(
                    width/4
                )
            );


        for(
            let f=0;
            f<floors;
            f++
        ){

            const y=
                2+
                f*
                (
                    (height-4)/
                    Math.max(
                        1,
                        floors-1
                    )
                );


            for(
                let c=0;
                c<cols;
                c++
            ){

                const wx=
                    x-width/2+2+
                    c*
                    (
                        (width-4)/
                        Math.max(
                            1,
                            cols-1
                        )
                    );


                const window =
                    BABYLON.MeshBuilder.CreateBox(
                        "window",
                        {
                            width:1.25,
                            height:1.45,
                            depth:.06
                        },
                        scene
                    );

                window.position.set(
                    wx,
                    y,
                    z-depth/2-.04
                );

                window.material=MAT.glass;
            }
        }
    }


    return body;
}


/* =========================================================
   DOWNTOWN
========================================================= */

function generateDowntown(){

    for(
        let i=0;
        i<45;
        i++
    ){

        const angle=
            Math.random()*
            Math.PI*2;

        const radius=
            60+
            Math.random()*90;


        const x=
            Math.cos(angle)*
            radius;

        const z=
            Math.sin(angle)*
            radius;


        createBuilding(
            x,
            z,
            14+
                Math.random()*14,
            12+
                Math.random()*12,
            30+
                Math.random()*80,
            "office",
            "도심 업무시설"
        );
    }
}


/* =========================================================
   OLD TOWN
========================================================= */

function generateOldTown(){

    for(
        let x=-210;
        x<=-80;
        x+=20
    ){

        for(
            let z=-70;
            z<=70;
            z+=24
        ){

            createBuilding(
                x+
                    (Math.random()-.5)*4,
                z+
                    (Math.random()-.5)*4,
                15,
                13,
                8+
                    Math.random()*12,
                Math.random()>.5
                    ?"old"
                    :"brick",
                "구도심 건물"
            );
        }
    }
}


/* =========================================================
   NEW TOWN
========================================================= */

function generateNewTown(){

    for(
        let x=100;
        x<=250;
        x+=30
    ){

        for(
            let z=-150;
            z<=150;
            z+=38
        ){

            createBuilding(
                x,
                z,
                19,
                17,
                45+
                    Math.random()*40,
                "residential",
                "신도시 주거단지"
            );
        }
    }
}


/* =========================================================
   PUBLIC INSTITUTION CLUSTER
========================================================= */

function generatePublicCluster(){

    createBuilding(
        0,
        0,
        45,
        30,
        65,
        "public",
        "통합 공공기관 본청"
    );


    createBuilding(
        -65,
        0,
        27,
        22,
        48,
        "public",
        "지역정책기관"
    );


    createBuilding(
        65,
        0,
        27,
        22,
        45,
        "public",
        "지역산업지원기관"
    );


    createBuilding(
        0,
        -65,
        35,
        25,
        50,
        "public",
        "공공연구센터"
    );


    createBuilding(
        0,
        65,
        31,
        24,
        42,
        "research",
        "산학협력센터"
    );
}


/* =========================================================

/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


let joystickX=0;

let joystickY=0;

let joystickActive=false;


joystick.addEventListener(
    "pointerdown",
    e=>{

        joystickActive=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        moveJoystick(e);
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            joystickActive
        )
            moveJoystick(e);
    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


function moveJoystick(e){

    const rect=
        joystick.getBoundingClientRect();


    let x=
        e.clientX-
        (
            rect.left+
            rect.width/2
        );


    let y=
        e.clientY-
        (
            rect.top+
            rect.height/2
        );


    const max=38;

    const distance=
        Math.hypot(
            x,
            y
        );


    if(
        distance>max
    ){

        x=
            x/distance*
            max;

        y=
            y/distance*
            max;
    }


    joystickX=
        x/max;

    joystickY=
        y/max;


    stick.style.left=
        (42+x)+"px";

    stick.style.top=
        (42+y)+"px";
}


function resetJoystick(){

    joystickActive=false;

    joystickX=0;

    joystickY=0;

    stick.style.left="42px";

    stick.style.top="42px";
}


/* =========================================================
   JOYSTICK MOVEMENT

   ★ 핵심 수정

   위 = 전진

   아래 = 후진

   그리고 전체 속도를 낮게 설정
========================================================= */

scene.onBeforeRenderObservable.add(()=>{

    if(
        scene.activeCamera !==
        walkCamera
    )
        return;


    const forward=
        new BABYLON.Vector3(
            Math.sin(
                walkCamera.rotation.y
            ),
            0,
            Math.cos(
                walkCamera.rotation.y
            )
        );


    const right=
        new BABYLON.Vector3(
            Math.cos(
                walkCamera.rotation.y
            ),
            0,
            -Math.sin(
                walkCamera.rotation.y
            )
        );


    /*
       위로 밀면 joystickY = -1

       -(-1) = +1

       따라서 정확히 전진
    */

    const movement=
        forward.scale(
            -joystickY*.12
        );


    movement.addInPlace(
        right.scale(
            joystickX*.12
        )
    );


    walkCamera.position
        .addInPlace(
            movement
        );


    /*
       사람 눈높이 유지
    */

    walkCamera.position.y=
        1.7;
});


/* =========================================================
   BUILDING CLICK
========================================================= */

scene.onPointerObservable.add(
    pointerInfo=>{

        if(
            pointerInfo.type !==
            BABYLON.PointerEventTypes
                .POINTERPICK
        )
            return;


        if(
            !pointerInfo.pickInfo.hit
        )
            return;


        const picked=
            pointerInfo
                .pickInfo
                .pickedMesh;


        const found=
            buildings.find(
                b=>
                    b.mesh===
                    picked
            );


        if(!found)
            return;


        showBuilding(
            found
        );
    }
);

        institution*.1+

function applyPreset(
    a,b,c,d,e,f
){

    const values=[
        a,b,c,d,e,f
    ];


    sliders.forEach(
        (pair,i)=>{

            document
                .getElementById(
                    pair[0]
                )
                .value=
                values[i];


            document
                .getElementById(
                    pair[1]
                )
                .textContent=
                values[i];
        }
    );


    calculateMetrics();


    toast(
        "도시 전략을 적용했습니다"
    );
}


/* =========================================================
   SIMULATION
========================================================= */

let simulationTimer=null;


function runSimulation(){

    if(simulationTimer)
        clearInterval(
            simulationTimer
        );


    let year=0;


    simulationTimer=
        setInterval(
            ()=>{

                year++;

                metrics.year=
                    year;


                const [
                    a,b,c,d,e,f
                ]=
                    getValues();


                const strength=
                    (
                        a+b+c+d+e+f
                    )/600;


                metrics.population=
                    42+
                    strength*18+
                    year*
                    strength*.35;


                metrics.companies=
                    180+
                    strength*220+
                    year*
                    strength*13;


                metrics.jobs=
                    7+
                    strength*4+
                    year*
                    strength*.15;


                metrics.commercial=
                    Math.min(
                        100,
                        45+
                        strength*35+
                        year*
                        strength*.7
                    );


                metrics.cooperation=
                    Math.min(
                        100,
                        40+
                        strength*35+
                        year*.8
                    );


                metrics.settlement=
                    Math.min(
                        100,
                        45+
                        strength*30+
                        year*.5
                    );


                updateMetrics();


                if(
                    year>=20
                ){

                    clearInterval(
                        simulationTimer
                    );


                    metrics.coexistence=
                        calculateCoexistenceIndex(
                            metrics
                        );


                    updateMetrics();


                    toast(
                        "20년 시뮬레이션 완료"
                    );
                }

            },
            180
        );
}


/* =========================================================
   COEXISTENCE INDEX ENGINE
=========================================================

   ★★★

   지금은 임시식.

   나중에 네가 실제 상생지수 산식을 주면
   이 함수에 그대로 넣는다.

========================================================= */

function calculateCoexistenceIndex(
    m
){

    const value=

        m.commercial*.20+

        m.cooperation*.30+

        m.settlement*.20+

        Math.min(
            100,
            m.companies/6
        )*.15+

        Math.min(
            100,
            m.jobs*5
        )*.15;


    return Math.max(
        0,
        Math.min(
            100,
            value
        )
    );
}
