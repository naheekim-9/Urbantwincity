<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PUBLIC CITY TWIN</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
    background:#9eb3bf;
}

#game{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

.panel{
    position:fixed;
    z-index:20;
    background:rgba(16,25,34,.88);
    color:#fff;
    border:1px solid rgba(255,255,255,.15);
    border-radius:15px;
    backdrop-filter:blur(15px);
    box-shadow:0 12px 35px rgba(0,0,0,.25);
}

#top{
    left:12px;
    right:12px;
    top:12px;
    height:62px;
    padding:11px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.title{
    font-weight:900;
    font-size:16px;
}

.sub{
    font-size:9px;
    color:#aab7c2;
    margin-top:3px;
}

#modeText{
    color:#69baff;
    font-size:11px;
    font-weight:800;
}

#controls{
    top:88px;
    left:12px;
    width:265px;
    max-height:calc(100% - 105px);
    overflow:auto;
    padding:14px;
}

.label{
    font-size:10px;
    font-weight:900;
    color:#aebbc6;
    margin-bottom:9px;
}

.slider{
    margin-bottom:11px;
}

.sliderHead{
    display:flex;
    justify-content:space-between;
    font-size:10px;
    margin-bottom:3px;
}

.sliderHead b{
    color:#64b9f4;
}

input[type=range]{
    width:100%;
    accent-color:#4ca9e8;
}

button{
    width:100%;
    min-height:40px;
    margin:3px 0;
    border:0;
    border-radius:9px;
    color:#fff;
    background:#293d4d;
    font-weight:800;
}

button.primary{background:#287fb8}
button.green{background:#197653}
button.orange{background:#896029}

#metrics{
    right:12px;
    bottom:12px;
    width:270px;
    padding:13px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.metric{
    background:rgba(255,255,255,.06);
    border-radius:9px;
    padding:8px;
}

.metric span{
    display:block;
    color:#93a4b2;
    font-size:8px;
}

.metric strong{
    display:block;
    font-size:15px;
    margin-top:2px;
}

#viewButtons{
    position:fixed;
    z-index:25;
    left:50%;
    bottom:13px;
    transform:translateX(-50%);
    width:250px;
    display:flex;
    gap:5px;
}

#viewButtons button{
    margin:0;
}

#joystick{
    display:none;
    position:fixed;
    z-index:30;
    left:18px;
    bottom:22px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(0,0,0,.23);
    border:2px solid rgba(255,255,255,.3);
    touch-action:none;
}

#stick{
    position:absolute;
    width:50px;
    height:50px;
    border-radius:50%;
    background:rgba(67,166,229,.92);
    left:38px;
    top:38px;
}

#info{
    display:none;
    right:12px;
    top:88px;
    width:280px;
    padding:15px;
}

#infoName{
    font-size:17px;
    font-weight:900;
}

#infoType{
    color:#67baf5;
    font-size:10px;
    margin-top:4px;
}

#infoText{
    color:#c0ccd5;
    font-size:10px;
    line-height:1.6;
    margin-top:9px;
}

#toast{
    display:none;
    position:fixed;
    z-index:100;
    left:50%;
    top:85px;
    transform:translateX(-50%);
    padding:9px 14px;
    border-radius:9px;
    background:rgba(10,20,30,.94);
    color:#fff;
    font-size:11px;
    font-weight:800;
}

@media(max-width:700px){
    #controls{width:225px}
    #metrics{width:210px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="top" class="panel">
    <div>
        <div class="title">PUBLIC CITY TWIN</div>
        <div class="sub">
            2차 공공기관 이전 · 기능·산업 중심 3D 디지털 트윈
        </div>
    </div>
    <div id="modeText">조감도</div>
</div>

<div id="controls" class="panel">

    <div class="label">도시 정책 변수</div>

    <div class="slider">
        <div class="sliderHead">
            <span>공공기관 집적도</span>
            <b id="n1">70</b>
        </div>
        <input id="s1" type="range" min="0" max="100" value="70">
    </div>

    <div class="slider">
        <div class="sliderHead">
            <span>산업 연계성</span>
            <b id="n2">65</b>
        </div>
        <input id="s2" type="range" min="0" max="100" value="65">
    </div>

    <div class="slider">
        <div class="sliderHead">
            <span>대학·연구 역량</span>
            <b id="n3">55</b>
        </div>
        <input id="s3" type="range" min="0" max="100" value="55">
    </div>

    <div class="slider">
        <div class="sliderHead">
            <span>정주 환경</span>
            <b id="n4">60</b>
        </div>
        <input id="s4" type="range" min="0" max="100" value="60">
    </div>

    <div class="slider">
        <div class="sliderHead">
            <span>교통 접근성</span>
            <b id="n5">60</b>
        </div>
        <input id="s5" type="range" min="0" max="100" value="60">
    </div>

    <div class="slider">
        <div class="sliderHead">
            <span>초기 기업 기반</span>
            <b id="n6">35</b>
        </div>
        <input id="s6" type="range" min="0" max="100" value="35">
    </div>

    <div class="label">도시 전략</div>

    <button onclick="preset(75,70,65,75,70,50)">
        균형형
    </button>

    <button onclick="preset(80,95,75,55,65,80)">
        산업 클러스터형
    </button>

    <button onclick="preset(65,55,60,95,75,40)">
        정주 우선형
    </button>

    <button onclick="preset(70,65,60,70,98,45)">
        교통 거점형
    </button>

    <div class="label" style="margin-top:14px">
        시뮬레이션
    </div>

    <button class="green" onclick="simulate()">
        ▶ 20년 시뮬레이션
    </button>

    <button class="orange" onclick="resetAll()">
        ↻ 초기화
    </button>

</div>

<div id="info" class="panel">
    <div id="infoName"></div>
    <div id="infoType"></div>
    <div id="infoText"></div>
</div>

<div id="metrics" class="panel">

    <div class="label">도시 성과</div>

    <div class="grid">

        <div class="metric">
            <span>정주인구</span>
            <strong id="population">52.0만</strong>
        </div>

        <div class="metric">
            <span>연계기업</span>
            <strong id="companies">350</strong>
        </div>

        <div class="metric">
            <span>일자리</span>
            <strong id="jobs">12.4만</strong>
        </div>

        <div class="metric">
            <span>상권 활성도</span>
            <strong id="commercial">63%</strong>
        </div>

        <div class="metric">
            <span>산학협력</span>
            <strong id="cooperation">48%</strong>
        </div>

        <div class="metric">
            <span>정착률</span>
            <strong id="settlement">61%</strong>
        </div>

    </div>
</div>

<div id="viewButtons">
    <button onclick="overview()">🛰️ 조감도</button>
    <button onclick="enterCity()">🚶 도시 진입</button>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="toast"></div>


<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

/* ============================================================
   ENGINE
============================================================ */

const canvas =
    document.getElementById("game");

const engine =
    new BABYLON.Engine(
        canvas,
        true,
        {
            antialias:true,
            adaptToDeviceRatio:true
        }
    );

const scene =
    new BABYLON.Scene(engine);


/* ============================================================
   SKY
============================================================ */

scene.clearColor =
    new BABYLON.Color4(
        0.58,
        0.70,
        0.78,
        1
    );


/* ============================================================
   CAMERA
============================================================ */

const camera =
    new BABYLON.UniversalCamera(
        "player",
        new BABYLON.Vector3(
            0,
            1.7,
            110
        ),
        scene
    );

camera.minZ=.05;
camera.maxZ=1000;

camera.speed=.45;

camera.angularSensibility=3500;


/* ============================================================
   LIGHT
============================================================ */

const sun =
    new BABYLON.DirectionalLight(
        "sun",
        new BABYLON.Vector3(
            -.45,
            -1,
            -.3
        ),
        scene
    );

sun.position =
    new BABYLON.Vector3(
        150,
        250,
        120
    );

sun.intensity=2.2;


const hemi =
    new BABYLON.HemisphericLight(
        "sky",
        new BABYLON.Vector3(
            0,
            1,
            0
        ),
        scene
    );

hemi.intensity=.72;


/* ============================================================
   SHADOW
============================================================ */

const shadows =
    new BABYLON.ShadowGenerator(
        2048,
        sun
    );

shadows.useBlurExponentialShadowMap=true;
shadows.blurKernel=24;


/* ============================================================
   MATERIALS
============================================================ */

function mat(name,color,rough=.7){

    const m =
        new BABYLON.PBRMaterial(
            name,
            scene
        );

    m.albedoColor =
        BABYLON.Color3.FromHexString(color);

    m.roughness=rough;
    m.metallic=0;

    return m;
}


const M={

    road:mat("road","#35383B",.94),

    sidewalk:mat("sidewalk","#9B9D9B",.9),

    grass:mat("grass","#4D744E",1),

    public:mat("public","#687D8D",.55),

    office:mat("office","#7B858B",.5),

    research:mat("research","#587E92",.25),

    university:mat("university","#796C83",.6),

    residential:mat("residential","#A0A6A6",.78),

    commercial:mat("commercial","#A17D5E",.62),

    industry:mat("industry","#6C7274",.82),

    glass:mat("glass","#5486A0",.08),

    white:mat("white","#E1E2E0",.7),

    dark:mat("dark","#17191A",.9),

    tree:mat("tree","#3C6E42",1),

    trunk:mat("trunk","#60442C",1),

    marking:mat("marking","#E8E7DE",.7)
};


/* ============================================================
   GROUND
============================================================ */

const ground =
    BABYLON.MeshBuilder.CreateGround(
        "ground",
        {
            width:460,
            height:460,
            subdivisions:4
        },
        scene
    );

ground.material=M.grass;


/* ============================================================
   CITY ARRAYS
============================================================ */

const buildings=[];
const cars=[];


/* ============================================================
   ROAD
============================================================ */

function road(x,z,w,d){

    const r =
        BABYLON.MeshBuilder.CreateBox(
            "road",
            {
                width:w,
                height:.12,
                depth:d
            },
            scene
        );

    r.position.set(
        x,
        .06,
        z
    );

    r.material=M.road;
}


/* ============================================================
   SIDEWALK
============================================================ */

function sidewalk(x,z,w,d){

    const s =
        BABYLON.MeshBuilder.CreateBox(
            "sidewalk",
            {
                width:w,
                height:.18,
                depth:d
            },
            scene
        );

    s.position.set(
        x,
        .13,
        z
    );

    s.material=M.sidewalk;
}


/* ============================================================
   ROAD NETWORK
============================================================ */

for(let i=-5;i<=5;i++){

    const p=i*35;

    road(0,p,460,10);

    sidewalk(0,p-6.5,460,2);
    sidewalk(0,p+6.5,460,2);

    road(p,0,10,460);

    sidewalk(p-6.5,0,2,460);
    sidewalk(p+6.5,0,2,460);
}


/* ============================================================
   ROAD MARKINGS
============================================================ */

for(let i=-5;i<=5;i++){

    const p=i*35;

    for(let x=-220;x<220;x+=14){

        const line =
            BABYLON.MeshBuilder.CreateBox(
                "lane",
                {
                    width:7,
                    height:.04,
                    depth:.25
                },
                scene
            );

        line.position.set(
            x,
            .13,
            p
        );

        line.material=M.marking;
    }

    for(let z=-220;z<220;z+=14){

        const line =
            BABYLON.MeshBuilder.CreateBox(
                "lane",
                {
                    width:.25,
                    height:.04,
                    depth:7
                },
                scene
            );

        line.position.set(
            p,
            .13,
            z
        );

        line.material=M.marking;
    }
}


/* ============================================================
   BUILDING
============================================================ */

function building(
    x,
    z,
    w,
    d,
    h,
    type,
    name
){

    const body =
        BABYLON.MeshBuilder.CreateBox(
            name,
            {
                width:w,
                depth:d,
                height:h
            },
            scene
        );

    body.position.set(
        x,
        h/2,
        z
    );

    body.material=M[type];

    shadows.addShadowCaster(body);


    const data={
        mesh:body,
        x,z,w,d,h,type,name
    };

    buildings.push(data);


    /*
       입체적인 외벽 프레임
    */

    if(type!=="industry"){

        for(let floor=0;floor<Math.min(12,Math.floor(h/5));floor++){

            const y=
                2.8+
                floor*
                Math.min(
                    5,
                    h/(Math.floor(h/5)+1)
                );

            for(let col=0;col<Math.min(8,Math.floor(w/4));col++){

                const wx=
                    x-w/2+
                    2+
                    col*
                    ((w-4)/
                    Math.max(
                        1,
                        Math.min(8,Math.floor(w/4))-1
                    ));

                const win =
                    BABYLON.MeshBuilder.CreateBox(
                        "window",
                        {
                            width:1.3,
                            height:1.55,
                            depth:.07
                        },
                        scene
                    );

                win.position.set(
                    wx,
                    y,
                    z-d/2-.04
                );

                win.material=M.glass;
            }
        }
    }


    /*
       지붕
    */

    const roof =
        BABYLON.MeshBuilder.CreateBox(
            "roof",
            {
                width:w+1,
                height:.35,
                depth:d+1
            },
            scene
        );

    roof.position.set(
        x,
        h+.18,
        z
    );

    roof.material=M.dark;
}


/* ============================================================
   LANDMARK PUBLIC INSTITUTION
============================================================ */

building(
    0,
    0,
    38,
    28,
    62,
    "public",
    "통합 공공기관 본청"
);


/*
   공공기관 중앙 아트리움
*/

const atrium =
    BABYLON.MeshBuilder.CreateBox(
        "atrium",
        {
            width:15,
            height:55,
            depth:7
        },
        scene
    );

atrium.position.set(
    0,
    27.5,
    -14.3
);

atrium.material=M.glass;


/* ============================================================
   PUBLIC BUILDINGS
============================================================ */

building(
    -48,0,
    25,19,45,
    "public",
    "지역정책기관"
);

building(
    48,0,
    25,19,42,
    "public",
    "지역산업지원기관"
);

building(
    0,-48,
    31,22,48,
    "research",
    "공공정책 연구센터"
);


/* ============================================================
   UNIVERSITY
============================================================ */

building(
    -80,-65,
    47,30,26,
    "university",
    "지역혁신대학"
);

building(
    -80,-30,
    27,18,34,
    "research",
    "산학협력센터"
);


/* ============================================================
   INDUSTRIAL CLUSTER
============================================================ */

for(let i=0;i<24;i++){

    const col=i%6;
    const row=Math.floor(i/6);

    building(
        70+col*18,
        -90+row*29,
        14,
        11,
        19+(i%5)*4,
        "industry",
        "연계기업 "+(i+1)
    );
}


/* ============================================================
   COMMERCIAL DISTRICT
============================================================ */

for(let i=0;i<18;i++){

    const col=i%6;
    const row=Math.floor(i/6);

    building(
        -105+col*21,
        48+row*24,
        14,
        11,
        17+(i%4)*5,
        "commercial",
        "상업시설 "+(i+1)
    );
}


/* ============================================================
   RESIDENTIAL
============================================================ */

for(let i=0;i<45;i++){

    const col=i%9;
    const row=Math.floor(i/9);

    const x=-125+col*31;
    const z=-15+row*29;

    if(
        Math.abs(x)<25 &&
        Math.abs(z)<30
    )
        continue;

    building(
        x,
        z,
        14,
        13,
        27+(i%6)*4,
        "residential",
        "주거단지 "+(i+1)
    );
}


/* ============================================================
   TREES
============================================================ */

function tree(x,z){

    const trunk =
        BABYLON.MeshBuilder.CreateCylinder(
            "trunk",
            {
                diameter:.65,
                height:4
            },
            scene
        );

    trunk.position.set(
        x,
        2,
        z
    );

    trunk.material=M.trunk;


    const crown =
        BABYLON.MeshBuilder.CreateSphere(
            "crown",
            {
                diameter:5,
                segments:10
            },
            scene
        );

    crown.position.set(
        x,
        5.4,
        z
    );

    crown.material=M.tree;

    shadows.addShadowCaster(crown);
}


/* ============================================================
   PARKS
============================================================ */

function park(x,z,w,d){

    const p =
        BABYLON.MeshBuilder.CreateBox(
            "park",
            {
                width:w,
                height:.2,
                depth:d
            },
            scene
        );

    p.position.set(
        x,
        .1,
        z
    );

    p.material=M.grass;


    for(let i=0;i<22;i++){

        tree(
            x+(Math.random()-.5)*(w-5),
            z+(Math.random()-.5)*(d-5)
        );
    }
}


park(-48,48,42,30);
park(60,-50,38,30);
park(75,70,40,28);


/* ============================================================
   CARS
============================================================ */

function car(horizontal){

    const root =
        new BABYLON.TransformNode(
            "car",
            scene
        );


    const body =
        BABYLON.MeshBuilder.CreateBox(
            "body",
            {
                width:2.3,
                height:.7,
                depth:4.4
            },
            scene
        );

    body.parent=root;
    body.position.y=.75;
    body.material=M.white;


    const cabin =
        BABYLON.MeshBuilder.CreateBox(
            "cabin",
            {
                width:1.75,
                height:.65,
                depth:2
            },
            scene
        );

    cabin.parent=root;
    cabin.position.y=1.3;
    cabin.material=M.glass;


    const positions=[
        [-1.05,.43,-1.45],
        [1.05,.43,-1.45],
        [-1.05,.43,1.45],
        [1.05,.43,1.45]
    ];


    positions.forEach(p=>{

        const wheel =
            BABYLON.MeshBuilder.CreateCylinder(
                "wheel",
                {
                    diameter:.7,
                    height:.3,
                    tessellation:12
                },
                scene
            );

        wheel.parent=root;
        wheel.rotation.z=Math.PI/2;

        wheel.position.set(
            p[0],
            p[1],
            p[2]
        );

        wheel.material=M.dark;
    });


    cars.push({
        root,
        horizontal,
        speed:.08+Math.random()*.08
    });
}


for(let i=0;i<25;i++)
    car(true);

for(let i=0;i<18;i++)
    car(false);


cars.forEach((c,i)=>{

    if(c.horizontal){

        c.root.position.x=
            -220+Math.random()*440;

        c.root.position.z=
            (Math.floor(Math.random()*11)-5)*35;

    }else{

        c.root.position.z=
            -220+Math.random()*440;

        c.root.position.x=
            (Math.floor(Math.random()*11)-5)*35;

        c.root.rotation.y=
            Math.PI/2;
    }
});


/* ============================================================
   MODE
============================================================ */

let mode="overview";


function overview(){

    mode="overview";

    camera.detachControl(canvas);

    document.getElementById(
        "joystick"
    ).style.display="none";

    document.getElementById(
        "modeText"
    ).textContent="조감도";


    camera.position=
        new BABYLON.Vector3(
            0,
            300,
            300
        );


    camera.setTarget(
        new BABYLON.Vector3(
            0,
            0,
            0
        )
    );


    toast("조감도 모드");
}


function enterCity(){

    mode="walk";

    camera.detachControl(canvas);

    document.getElementById(
        "joystick"
    ).style.display="block";

    document.getElementById(
        "modeText"
    ).textContent="사람 시점";


    /*
       ★ 사람 눈높이
    */

    camera.position=
        new BABYLON.Vector3(
            0,
            1.7,
            115
        );


    camera.rotation=
        new BABYLON.Vector3(
            0,
            Math.PI,
            0
        );


    toast("도시에 들어왔습니다");
}


/* ============================================================
   LOOK
============================================================ */

let looking=false;
let lx=0;
let ly=0;


canvas.addEventListener(
    "pointerdown",
    e=>{

        if(mode!=="walk")
            return;

        looking=true;

        lx=e.clientX;
        ly=e.clientY;

        canvas.setPointerCapture(
            e.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!looking || mode!=="walk")
            return;

        const dx=e.clientX-lx;
        const dy=e.clientY-ly;

        lx=e.clientX;
        ly=e.clientY;


        camera.rotation.y -=
            dx*.004;


        camera.rotation.x -=
            dy*.003;


        camera.rotation.x=
            Math.max(
                -.9,
                Math.min(
                    .9,
                    camera.rotation.x
                )
            );
    }
);


canvas.addEventListener(
    "pointerup",
    ()=>{
        looking=false;
    }
);


/* ============================================================
   JOYSTICK
============================================================ */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );


let jx=0;
let jy=0;
let active=false;


joystick.addEventListener(
    "pointerdown",
    e=>{

        active=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickMove(e);
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(active)
            joystickMove(e);
    }
);


joystick.addEventListener(
    "pointerup",
    joystickReset
);


joystick.addEventListener(
    "pointercancel",
    joystickReset
);


function joystickMove(e){

    const r=
        joystick.getBoundingClientRect();


    let x=
        e.clientX-
        (r.left+r.width/2);


    let y=
        e.clientY-
        (r.top+r.height/2);


    const max=40;

    const length=
        Math.hypot(x,y);


    if(length>max){

        x=x/length*max;
        y=y/length*max;
    }


    jx=x/max;
    jy=y/max;


    stick.style.left=
        (40+x)+"px";

    stick.style.top=
        (40+y)+"px";
}


function joystickReset(){

    active=false;

    jx=0;
    jy=0;

    stick.style.left="40px";
    stick.style.top="40px";
}


/* ============================================================
   PLAYER MOVEMENT
============================================================ */

setInterval(()=>{

    if(mode!=="walk")
        return;


    const speed=.55;


    /*
       카메라가 보는 방향
    */

    const forward=
        new BABYLON.Vector3(
            Math.sin(camera.rotation.y),
            0,
            Math.cos(camera.rotation.y)
        );


    const right=
        new BABYLON.Vector3(
            Math.cos(camera.rotation.y),
            0,
            -Math.sin(camera.rotation.y)
        );


    /*
       ★ 핵심

       joystick 위쪽:
       jy = -1

       따라서 -jy = +1

       → 바라보는 방향으로 전진
    */

    camera.position.addInPlace(
        forward.scale(
            -jy*speed
        )
    );


    camera.position.addInPlace(
        right.scale(
            jx*speed
        )
    );


    camera.position.y=1.7;


    /*
       도시 경계
    */

    camera.position.x=
        Math.max(
            -215,
            Math.min(
                215,
                camera.position.x
            )
        );


    camera.position.z=
        Math.max(
            -215,
            Math.min(
                215,
                camera.position.z
            )
        );

},20);


/* ============================================================
   BUILDING CLICK
============================================================ */

scene.onPointerObservable.add(
    info=>{

        if(
            info.type !==
            BABYLON.PointerEventTypes.POINTERPICK
        )
            return;


        if(!info.pickInfo.hit)
            return;


        const mesh=
            info.pickInfo.pickedMesh;


        const b=
            buildings.find(
                x=>x.mesh===mesh
            );


        if(!b)
            return;


        showInfo(b);
    }
);


function showInfo(b){

    const types={

        public:"공공기관",

        research:"연구·R&D",

        university:"대학·교육",

        residential:"주거",

        commercial:"상업",

        industry:"산업·기업"
    };


    document.getElementById(
        "info"
    ).style.display="block";


    document.getElementById(
        "infoName"
    ).textContent=b.name;


    document.getElementById(
        "infoType"
    ).textContent=
        types[b.type];


    document.getElementById(
        "infoText"
    ).textContent=

        "이 시설은 공공기관 이전에 따른 기능적 연계와 지역경제 파급효과를 분석하기 위한 가상 도시 구성요소입니다.";
}


/* ============================================================
   VARIABLES
============================================================ */

const pairs=[
    ["s1","n1"],
    ["s2","n2"],
    ["s3","n3"],
    ["s4","n4"],
    ["s5","n5"],
    ["s6","n6"]
];


pairs.forEach(p=>{

    const input=
        document.getElementById(p[0]);

    const number=
        document.getElementById(p[1]);


    input.addEventListener(
        "input",
        ()=>{

            number.textContent=
                input.value;

            calculate();
        }
    );
});


function values(){

    return pairs.map(
        p=>
            Number(
                document.getElementById(
                    p[0]
                ).value
            )
    );
}


/* ============================================================
   SIMULATION STATE
============================================================ */

const state={

    population:52,

    companies:350,

    jobs:12.4,

    commercial:63,

    cooperation:48,

    settlement:61,

    year:0,

    coexistenceIndex:null
};


/* ============================================================
   BASIC CALCULATION
============================================================ */

function calculate(){

    const [
        institution,
        industry,
        research,
        settlement,
        transport,
        firms
    ]=values();


    const strength=

        institution*.18+
        industry*.22+
        research*.15+
        settlement*.18+
        transport*.15+
        firms*.12;


    state.population=
        32+
        strength*.43;


    state.companies=
        120+
        industry*3+
        research*1.5+
        firms*2;


    state.jobs=
        5+
        state.companies*.17+
        strength*.15;


    state.commercial=
        settlement*.4+
        transport*.2+
        industry*.2+
        institution*.1+
        research*.1;


    state.cooperation=
        research*.55+
        industry*.25+
        institution*.2;


    state.settlement=
        settlement*.55+
        transport*.2+
        institution*.1+
        research*.15;


    display();
}


function display(){

    document.getElementById(
        "population"
    ).textContent=
        state.population.toFixed(1)+"만";


    document.getElementById(
        "companies"
    ).textContent=
        Math.round(
            state.companies
        );


    document.getElementById(
        "jobs"
    ).textContent=
        state.jobs.toFixed(1)+"만";


    document.getElementById(
        "commercial"
    ).textContent=
        Math.round(
            state.commercial
        )+"%";


    document.getElementById(
        "cooperation"
    ).textContent=
        Math.round(
            state.cooperation
        )+"%";


    document.getElementById(
        "settlement"
    ).textContent=
        Math.round(
            state.settlement
        )+"%";
}


calculate();


/* ============================================================
   PRESET
============================================================ */

function preset(
    a,b,c,d,e,f
){

    const arr=[
        a,b,c,d,e,f
    ];


    pairs.forEach(
        (p,i)=>{

            document.getElementById(
                p[0]
            ).value=
                arr[i];


            document.getElementById(
                p[1]
            ).textContent=
                arr[i];
        }
    );


    calculate();

    toast(
        "도시 전략이 적용되었습니다"
    );
}


/* ============================================================
   20 YEAR SIMULATION
============================================================ */

let timer=null;


function simulate(){

    if(timer)
        clearInterval(timer);


    let year=0;


    timer=setInterval(()=>{

        year++;

        state.year=year;


        const [
            a,b,c,d,e,f
        ]=values();


        const strength=
            (a+b+c+d+e+f)/600;


        state.population=
            42+
            strength*18+
            year*
            strength*.35;


        state.companies=
            180+
            strength*220+
            year*
            strength*13;


        state.jobs=
            7+
            strength*4+
            year*
            strength*.15;


        state.commercial=
            Math.min(
                100,
                45+
                strength*35+
                year*
                strength*.7
            );


        state.cooperation=
            Math.min(
                100,
                40+
                strength*35+
                year*.8
            );


        state.settlement=
            Math.min(
                100,
                45+
                strength*30+
                year*.5
            );


        display();


        document.getElementById(
            "modeText"
        ).textContent=
            "시뮬레이션 "+
            year+
            "년차";


        if(year>=20){

            clearInterval(timer);


            state.coexistenceIndex=
                calculateCoexistenceIndex(
                    state
                );


            toast(
                "20년 완료 · 상생지수 "+
                state.coexistenceIndex.toFixed(1)
            );
        }

    },180);
}


/* ============================================================
   FUTURE COEXISTENCE INDEX
============================================================ */

function calculateCoexistenceIndex(s){

    /*
       ★★★★★

       나중에 네가 알려주는
       실제 '상생지수 계산법'으로
       이 함수만 교체하면 된다.

       예:

       기관-기업 연계
       산학협력
       지역고용
       정주
       상권
       교통
       인구유지

       등의 실제 산식을
       그대로 넣을 수 있음.
    */


    return Math.max(
        0,
        Math.min(
            100,

            s.commercial*.20+
            s.cooperation*.30+
            s.settlement*.20+
            Math.min(
                100,
                s.companies/6
            )*.15+
            Math.min(
                100,
                s.jobs*5
            )*.15
        )
    );
}


/* ============================================================
   RESET
============================================================ */

function resetAll(){

    if(timer)
        clearInterval(timer);


    preset(
        70,
        65,
        55,
        60,
        60,
        35
    );


    state.year=0;

    overview();
}


/* ============================================================
   TOAST
============================================================ */

function toast(text){

    const t=
        document.getElementById(
            "toast"
        );


    t.textContent=text;
    t.style.display="block";


    setTimeout(
        ()=>{
            t.style.display="none";
        },
        1800
    );
}


/* ============================================================
   CAR ANIMATION
============================================================ */

scene.onBeforeRenderObservable.add(()=>{

    cars.forEach(c=>{

        if(c.horizontal){

            c.root.position.x+=
                c.speed;

            if(
                c.root.position.x>230
            )
                c.root.position.x=-230;

        }else{

            c.root.position.z+=
                c.speed;

            if(
                c.root.position.z>230
            )
                c.root.position.z=-230;
        }
    });
});
