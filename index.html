<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도시 테스트</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#9bb3c7;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#status{
    position:fixed;
    top:20px;
    left:20px;
    padding:12px 16px;
    background:white;
    border-radius:10px;
    font-family:sans-serif;
    font-weight:bold;
    z-index:10;
}
</style>
</head>

<body>

<div id="status">도시 렌더링 테스트</div>

<canvas id="canvas"></canvas>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

function resize(){

    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* 배경 */

function draw(){

    const w=canvas.width;
    const h=canvas.height;

    ctx.clearRect(0,0,w,h);

    /* 하늘 */

    ctx.fillStyle="#9bb3c7";
    ctx.fillRect(0,0,w,h*0.55);

    /* 땅 */

    ctx.fillStyle="#78936f";
    ctx.fillRect(0,h*0.55,w,h*0.45);


    /* 도로 */

    ctx.fillStyle="#303943";

    ctx.fillRect(
        0,
        h*0.68,
        w,
        100
    );

    ctx.fillRect(
        w*0.43,
        h*0.55,
        180,
        h*0.45
    );


    /* 중앙 공공기관 */

    drawBuilding(
        w*0.48,
        h*0.38,
        180,
        230,
        "#326da6"
    );


    /* 왼쪽 연구기관 */

    drawBuilding(
        w*0.23,
        h*0.48,
        120,
        150,
        "#586f9b"
    );


    /* 오른쪽 기업 */

    drawBuilding(
        w*0.72,
        h*0.48,
        130,
        170,
        "#777d83"
    );


    /* 주거 */

    drawBuilding(
        w*0.12,
        h*0.65,
        90,
        120,
        "#71808e"
    );

    drawBuilding(
        w*0.85,
        h*0.65,
        90,
        135,
        "#71808e"
    );


    /* 대학 */

    drawBuilding(
        w*0.27,
        h*0.72,
        150,
        95,
        "#765a9d"
    );


    /* 나무 */

    drawTree(
        w*0.38,
        h*0.67
    );

    drawTree(
        w*0.62,
        h*0.67
    );


    document.getElementById("status").innerText=
        "✓ 도시 렌더링 정상";

    requestAnimationFrame(draw);
}


/* 건물 */

function drawBuilding(
    x,
    y,
    width,
    height,
    color
){

    /* 그림자 */

    ctx.fillStyle="rgba(0,0,0,.18)";

    ctx.fillRect(
        x-width/2+15,
        y-height,
        width,
        height
    );


    /* 건물 */

    ctx.fillStyle=color;

    ctx.fillRect(
        x-width/2,
        y-height,
        width,
        height
    );


    /* 지붕 */

    ctx.fillStyle=lighten(color);

    ctx.fillRect(
        x-width/2,
        y-height,
        width,
        12
    );


    /* 창문 */

    ctx.fillStyle="rgba(220,235,245,.65)";

    for(
        let yy=y-height+30;
        yy<y-15;
        yy+=28
    ){

        for(
            let xx=x-width/2+15;
            xx<x+width/2-10;
            xx+=25
        ){

            ctx.fillRect(
                xx,
                yy,
                12,
                10
            );

        }
    }
}


/* 나무 */

function drawTree(x,y){

    ctx.fillStyle="#68472d";

    ctx.fillRect(
        x-5,
        y,
        10,
        35
    );

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        25,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#2f7040";
    ctx.fill();
}


/* 색 밝게 */

function lighten(color){

    return "#5d92bd";
}


draw();

</script>

</body>
</html>
