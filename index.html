<style>

<script>

/* =========================================================
   PUBLIC CITY TWIN
   안정성을 위해 외부 라이브러리 없이 구현
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=Math.min(devicePixelRatio||1,2);

function resize(){

    W=innerWidth;
    H=innerHeight;

    DPR=Math.min(devicePixelRatio||1,2);

    canvas.width=W*DPR;
    canvas.height=H*DPR;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();


/* =========================================================
   도시 데이터
========================================================= */

const buildings=[];
const roads=[];
const trees=[];
const parks=[];
const vehicles=[];


/* 건물 생성 */

function building(
    x,
    z,
    w,
    d,
    h,
    type,
    name
){

    buildings.push({

        id:buildings.length,

        x,z,w,d,h,

        type,
        name,

        population:0,
        jobs:0,
        firms:0
    });
}


/* =========================================================
   도시 생성
========================================================= */

function generateCity(){

    buildings.length=0;
    roads.length=0;
    trees.length=0;
    parks.length=0;
    vehicles.length=0;


    /* -------------------------------
       중앙 공공기관
    -------------------------------- */

    building(
        0,0,
        34,24,
        62,
        "public",
        "통합 공공기관 본청"
    );

    building(
        -45,0,
        25,19,
        44,
        "public",
        "지역정책기관"
    );

    building(
        45,0,
        25,19,
        41,
        "public",
        "지역산업지원기관"
    );

    building(
        0,-45,
        30,22,
        48,
        "research",
        "공공정책 연구센터"
    );


    /* -------------------------------
       대학
    -------------------------------- */

    building(
        -72,-62,
        48,30,
        27,
        "university",
        "지역혁신대학"
    );

    building(
        -72,-29,
        27,18,
        34,
        "university",
        "산학협력센터"
    );


    /* -------------------------------
       산업 클러스터
    -------------------------------- */

    for(let i=0;i<24;i++){

        const col=i%6;
        const row=Math.floor(i/6);

        building(

            57+col*18,
            -82+row*29,

            14,
            12,

            18+(i%5)*5,

            "industry",

            "연계기업 "+(i+1)
        );
    }


    /* -------------------------------
       상업지구
    -------------------------------- */

    for(let i=0;i<18;i++){

        const col=i%6;
        const row=Math.floor(i/6);

        building(

            -98+col*22,
            46+row*24,

            14,
            12,

            16+(i%4)*6,

            "commercial",

            "상업시설 "+(i+1)
        );
    }


    /* -------------------------------
       주거지역
    -------------------------------- */

    for(let i=0;i<42;i++){

        const col=i%7;
        const row=Math.floor(i/7);

        const x=-102+col*31;
        const z=-12+row*28;

        if(Math.abs(x)<27 && Math.abs(z)<27)
            continue;

        building(

            x,z,

            13,12,

            25+(i%6)*5,

            "residential",

            "주거단지 "+(i+1)
        );
    }


    /* -------------------------------
       공원
    -------------------------------- */

    parks.push({
        x:-45,
        z:45,
        w:40,
        d:30
    });

    parks.push({
        x:58,
        z:-48,
        w:38,
        d:30
    });

    parks.push({
        x:68,
        z:66,
        w:38,
        d:30
    });


    /* -------------------------------
       나무
    -------------------------------- */

    for(const p of parks){

        for(let i=0;i<20;i++){

            trees.push({

                x:
                    p.x+
                    (Math.random()-.5)*p.w,

                z:
                    p.z+
                    (Math.random()-.5)*p.d,

                h:
                    4+
                    Math.random()*3
            });
        }
    }


    /* -------------------------------
       차량
    -------------------------------- */

    for(let i=0;i<28;i++){

        vehicles.push({

            x:-135+Math.random()*270,

            z:
                Math.round(
                    (-4+Math.random()*8)
                )*32,

            speed:.2+
                Math.random()*.35,

            vertical:false,

            color:
                ["#ffffff","#222222","#d94d45","#3f73a8"]
                [i%4]
        });
    }

    for(let i=0;i<18;i++){

        vehicles.push({

            x:
                Math.round(
                    (-4+Math.random()*8)
                )*32,

            z:-135+Math.random()*270,

            speed:.2+
                Math.random()*.3,

            vertical:true,

            color:
                ["#ffffff","#222222","#d94d45","#3f73a8"]
                [i%4]
        });
    }
}

generateCity();


/* =========================================================
   카메라
=========================================================

   기존 코드의 가장 큰 문제였던
   좌표 방향을 여기서 수정.

   도시 위쪽 = 북쪽
   화면 위쪽 = 북쪽

========================================================= */

const camera={

    x:0,
    y:180,
    z:210,

    yaw:0,

    pitch:.63,

    zoom:1
};

let mode="overview";


/* =========================================================
   3D 투영
========================================================= */

function project(x,y,z){

    let dx=x-camera.x;
    let dy=y-camera.y;
    let dz=z-camera.z;


    /* Y축 회전 */

    const cy=Math.cos(camera.yaw);
    const sy=Math.sin(camera.yaw);

    const rx=
        dx*cy-
        dz*sy;

    const rz=
        dx*sy+
        dz*cy;


    /* X축 회전 */

    const cp=Math.cos(camera.pitch);
    const sp=Math.sin(camera.pitch);

    const ry=
        dy*cp-
        rz*sp;

    const rz2=
        dy*sp+
        rz*cp;


    /*
       카메라 앞쪽은 rz2 < 0
    */

    const depth=
        Math.max(
            35,
            -rz2+250
        );


    const focal=
        520*camera.zoom;


    return {

        x:
            W/2+
            rx*focal/depth,

        y:
            H/2-
            ry*focal/depth,

        depth
    };
}


/* =========================================================
   색상
========================================================= */

const colors={

    public:"#467fae",

    research:"#587b9b",

    university:"#8065a5",

    industry:"#777d82",

    commercial:"#b27a4b",

    residential:"#71828d"
};


function colorShade(hex,n){

    let r=parseInt(hex.slice(1,3),16);
    let g=parseInt(hex.slice(3,5),16);
    let b=parseInt(hex.slice(5,7),16);

    r=Math.max(0,Math.min(255,r+n));
    g=Math.max(0,Math.min(255,g+n));
    b=Math.max(0,Math.min(255,b+n));

    return `rgb(${r},${g},${b})`;
}


/* =========================================================
   지면
========================================================= */

function drawGround(){

    const a=project(-170,0,-170);
    const b=project(170,0,-170);
    const c=project(170,0,170);
    const d=project(-170,0,170);

    ctx.beginPath();

    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.lineTo(c.x,c.y);
    ctx.lineTo(d.x,d.y);

    ctx.closePath();

    ctx.fillStyle="#8fa685";
    ctx.fill();


    /*
       멀리 있는 지면을 자연스럽게
       보이도록 그라데이션
    */

    const grad=
        ctx.createLinearGradient(
            0,0,0,H
        );

    grad.addColorStop(
        0,
        "rgba(255,255,255,.10)"
    );

    grad.addColorStop(
        1,
        "rgba(20,50,30,.16)"
    );

    ctx.fillStyle=grad;

    ctx.fillRect(
        0,
        H*.45,
        W,
        H*.55
    );
}


/* =========================================================
   도로
========================================================= */

function drawRoads(){

    /* 가로 도로 */

    for(let i=-4;i<=4;i++){

        const z=i*32;

        const p1=project(-150,.1,z-6);
        const p2=project(150,.1,z-6);
        const p3=project(150,.1,z+6);
        const p4=project(-150,.1,z+6);

        ctx.beginPath();

        ctx.moveTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.lineTo(p3.x,p3.y);
        ctx.lineTo(p4.x,p4.y);

        ctx.closePath();

        ctx.fillStyle="#3d4449";
        ctx.fill();


        const a=project(-150,.2,z);
        const b=project(150,.2,z);

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);

        ctx.strokeStyle=
            "rgba(242,222,147,.72)";

        ctx.lineWidth=1;

        ctx.setLineDash([9,9]);

        ctx.stroke();

        ctx.setLineDash([]);
    }


    /* 세로 도로 */

    for(let i=-4;i<=4;i++){

        const x=i*32;

        const p1=project(x-6,.1,-150);
        const p2=project(x+6,.1,-150);
        const p3=project(x+6,.1,150);
        const p4=project(x-6,.1,150);

        ctx.beginPath();

        ctx.moveTo(p1.x,p1.y);
        ctx.lineTo(p2.x,p2.y);
        ctx.lineTo(p3.x,p3.y);
        ctx.lineTo(p4.x,p4.y);

        ctx.closePath();

        ctx.fillStyle="#3d4449";
        ctx.fill();
    }


    /* 횡단보도 */

    for(let i=-3;i<=3;i++){

        const z=i*32;

        for(let k=-4;k<=4;k++){

            const x=k*32;

            const a=project(
                x-4,
                .25,
                z-3
            );

            const b=project(
                x+4,
                .25,
                z-3
            );

            const c=project(
                x+4,
                .25,
                z-1
            );

            const d=project(
                x-4,
                .25,
                z-1
            );

            ctx.beginPath();

            ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);
            ctx.lineTo(c.x,c.y);
            ctx.lineTo(d.x,d.y);

            ctx.closePath();

            ctx.fillStyle=
                "rgba(235,235,235,.65)";

            ctx.fill();
        }
    }
}


/* =========================================================
   공원
========================================================= */

function drawParks(){

    for(const p of parks){

        const a=project(
            p.x-p.w/2,
            .1,
            p.z-p.d/2
        );

        const b=project(
            p.x+p.w/2,
            .1,
            p.z-p.d/2
        );

        const c=project(
            p.x+p.w/2,
            .1,
            p.z+p.d/2
        );

        const d=project(
            p.x-p.w/2,
            .1,
            p.z+p.d/2
        );

        ctx.beginPath();

        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.lineTo(c.x,c.y);
        ctx.lineTo(d.x,d.y);

        ctx.closePath();

        ctx.fillStyle="#4f8b58";
        ctx.fill();


        /*
           공원 산책로
        */

        const center=project(
            p.x,
            .2,
            p.z
        );

        ctx.beginPath();

        ctx.arc(
            center.x,
            center.y,
            15,
            0,
            Math.PI*2
        );

        ctx.strokeStyle=
            "rgba(220,202,161,.7)";

        ctx.lineWidth=3;

        ctx.stroke();
    }
}


/* =========================================================
   나무
========================================================= */

function drawTree(t){

    const base=project(
        t.x,
        0,
        t.z
    );

    const top=project(
        t.x,
        t.h,
        t.z
    );

    const s=
        Math.max(
            .45,
            1/(top.depth/250)
        );


    /* 줄기 */

    ctx.beginPath();

    ctx.moveTo(
        base.x,
        base.y
    );

    ctx.lineTo(
        top.x,
        top.y+8*s
    );

    ctx.strokeStyle="#62472e";
    ctx.lineWidth=3*s;
    ctx.stroke();


    /* 잎 */

    ctx.beginPath();

    ctx.arc(
        top.x,
        top.y,
        8*s,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#326c3e";
    ctx.fill();
}


/* =========================================================
   건물
========================================================= */

function drawBuilding(b){

    const x=b.x;
    const z=b.z;
    const w=b.w;
    const d=b.d;
    const h=b.h;


    /*
       네 꼭짓점
    */

    const bottom=[

        project(
            x-w/2,
            0,
            z-d/2
        ),

        project(
            x+w/2,
            0,
            z-d/2
        ),

        project(
            x+w/2,
            0,
            z+d/2
        ),

        project(
            x-w/2,
            0,
            z+d/2
        )
    ];


    const top=[

        project(
            x-w/2,
            h,
            z-d/2
        ),

        project(
            x+w/2,
            h,
            z-d/2
        ),

        project(
            x+w/2,
            h,
            z+d/2
        ),

        project(
            x-w/2,
            h,
            z+d/2
        )
    ];


    const base=
        colors[b.type];


    /*
       왼쪽 벽
    */

    polygon(
        [
            bottom[0],
            bottom[3],
            top[3],
            top[0]
        ],
        colorShade(base,-18)
    );


    /*
       오른쪽 벽
    */

    polygon(
        [
            bottom[1],
            bottom[2],
            top[2],
            top[1]
        ],
        colorShade(base,-34)
    );


    /*
       지붕
    */

    polygon(
        top,
        colorShade(base,8)
    );


    /*
       창문
    */

    if(
        b.type!=="industry"
    ){

        const floors=
            Math.max(
                2,
                Math.floor(h/6)
            );

        const rows=
            Math.min(
                floors,
                11
            );


        for(
            let floor=1;
            floor<rows;
            floor++
        ){

            const t=
                floor/rows;


            for(
                let col=0;
                col<4;
                col++
            ){

                const u=
                    .13+
                    col*.22;


                const left={

                    x:
                        top[0].x+
                        (
                            bottom[0].x-
                            top[0].x
                        )*t,

                    y:
                        top[0].y+
                        (
                            bottom[0].y-
                            top[0].y
                        )*t
                };


                const right={

                    x:
                        top[1].x+
                        (
                            bottom[1].x-
                            top[1].x
                        )*t,

                    y:
                        top[1].y+
                        (
                            bottom[1].y-
                            top[1].y
                        )*t
                };


                const wx=
                    left.x+
                    (right.x-left.x)*u;

                const wy=
                    left.y+
                    (right.y-left.y)*u;


                ctx.fillStyle=
                    floor%3===0
                    ? "rgba(190,221,239,.72)"
                    : "rgba(219,235,242,.50)";


                ctx.fillRect(
                    wx,
                    wy,
                    3.5,
                    5
                );
            }
        }
    }


    /*
       산업시설은 큰 창고형
    */

    if(
        b.type==="industry"
    ){

        const p=
            project(
                x,
                h*.55,
                z-d/2-.1
            );

        ctx.fillStyle=
            "rgba(220,220,220,.7)";

        ctx.fillRect(
            p.x-10,
            p.y-6,
            20,
            9
        );
    }


    /*
       공공기관의 입구
    */

    if(
        b.type==="public"
    ){

        const p=
            project(
                x,
                h*.35,
                z-d/2-.2
            );

        ctx.fillStyle=
            "#e9eef0";

        ctx.fillRect(
            p.x-7,
            p.y-11,
            14,
            11
        );


        /*
           기관 간판
        */

        ctx.fillStyle=
            "rgba(250,250,250,.9)";

        ctx.fillRect(
            p.x-20,
            p.y-24,
            40,
            8
        );
    }


    /*
       아파트 발코니
    */

    if(
        b.type==="residential"
    ){

        for(
            let i=0;
            i<Math.min(6,Math.floor(h/8));
            i++
        ){

            const p=
                project(
                    x+w*.32,
                    h*.2+i*7,
                    z-d/2-.3
                );

            ctx.strokeStyle=
                "rgba(230,230,230,.6)";

            ctx.lineWidth=1;

            ctx.strokeRect(
                p.x-4,
                p.y-3,
                8,
                5
            );
        }
    }
}


/* =========================================================
   다각형
========================================================= */

function polygon(points,color){

    ctx.beginPath();

    ctx.moveTo(
        points[0].x,
        points[0].y
    );

    for(
        let i=1;
        i<points.length;
        i++
    ){

        ctx.lineTo(
            points[i].x,
            points[i].y
        );
    }

    ctx.closePath();

    ctx.fillStyle=color;
    ctx.fill();
}


/* =========================================================
   차량
========================================================= */

function drawVehicle(v){

    if(v.vertical){

        v.z+=v.speed;

        if(v.z>150)
            v.z=-150;

    }else{

        v.x+=v.speed;

        if(v.x>150)
            v.x=-150;
    }


    const p=
        project(
            v.x,
            1.1,
            v.z
        );


    const s=
        Math.max(
            .45,
            250/p.depth
        );


    /*
       차체
    */

    ctx.fillStyle=v.color;

    ctx.fillRect(
        p.x-5*s,
        p.y-2*s,
        10*s,
        4*s
    );


    /*
       유리
    */

    ctx.fillStyle=
        "rgba(65,90,105,.85)";

    ctx.fillRect(
        p.x-2.5*s,
        p.y-1.5*s,
        5*s,
        2*s
    );


    /*
       바퀴
    */

    ctx.fillStyle="#161616";

    ctx.fillRect(
        p.x-4*s,
        p.y+2*s,
        2*s,
        1.5*s
    );

    ctx.fillRect(
        p.x+2*s,
        p.y+2*s,
        2*s,
        1.5*s
    );
}


/* =========================================================
   렌더링
========================================================= */

function render(){

    /*
       하늘
    */

    const sky=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    sky.addColorStop(
        0,
        "#91adbd"
    );

    sky.addColorStop(
        .48,
        "#c9d5d9"
    );

    sky.addColorStop(
        1,
        "#dce0dc"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    drawGround();

    drawRoads();

    drawParks();


    /*
       깊이 순으로 정렬
    */

    const objects=[];


    for(const b of buildings){

        const p=
            project(
                b.x,
                0,
                b.z
            );

        objects.push({
            depth:p.depth,
            type:"building",
            data:b
        });
    }


    for(const t of trees){

        const p=
            project(
                t.x,
                0,
                t.z
            );

        objects.push({
            depth:p.depth,
            type:"tree",
            data:t
        });
    }


    objects.sort(
        (a,b)=>
            b.depth-a.depth
    );


    for(const o of objects){

        if(
            o.type==="building"
        )
            drawBuilding(o.data);

        else
            drawTree(o.data);
    }


    /*
       차량은 가장 마지막에
    */

    for(const v of vehicles)
        drawVehicle(v);


    requestAnimationFrame(render);
}

render();


/* =========================================================

const sliders=[

function values(){

/* =========================================================
   지표
========================================================= */

const state={

    year:0,

    population:52,

    companies:350,

    jobs:12.4,

    commercial:63,

    cooperation:48,

    settlement:61,

    coexistenceIndex:null
};


function updateMetrics(){

    const [
        institution,
        industry,
        research,
        settlement,
        transport,
        firms
    ]=values();


    const total=

        institution*.18+
        industry*.22+
        research*.15+
        settlement*.18+
        transport*.15+
        firms*.12;


    state.population=
        32+
        total*.43;

    state.companies=
        120+
        industry*3+
        research*1.5+
        firms*2;

    state.jobs=
        5+
        state.companies*.17+
        total*.15;

    state.commercial=
        settlement*.4+
        transport*.2+
        industry*.2+
        institution*.1+
        research*.1;

    state.cooperation=
        research*.55+
        industry*.25+
        institution*.20;

    state.settlement=
        settlement*.55+
        transport*.2+
        institution*.1+
        research*.15;


    displayMetrics();
}


function displayMetrics(){

    document.getElementById(
        "population"
    ).textContent=
        state.population.toFixed(1)+"만";


    document.getElementById(
        "companies"
    ).textContent=
        Math.round(
            state.companies
        );


    document.getElementById(
        "jobs"
    ).textContent=
        state.jobs.toFixed(1)+"만";


    document.getElementById(
        "commercial"
    ).textContent=
        Math.round(
            state.commercial
        )+"%";


    document.getElementById(
        "cooperation"
    ).textContent=
        Math.round(
            state.cooperation
        )+"%";


    document.getElementById(
        "settlement"
    ).textContent=
        Math.round(
            state.settlement
        )+"%";
}

updateMetrics();


/* =========================================================
   프리셋
========================================================= */

function preset(
    a,b,c,d,e,f
){

    const arr=[a,b,c,d,e,f];


    sliders.forEach(
        (pair,i)=>{

            document.getElementById(
                pair[0]
            ).value=arr[i];

            document.getElementById(
                pair[1]
            ).textContent=arr[i];
        }
    );


    updateMetrics();

    toast("도시 전략이 적용되었습니다.");
}


/* =========================================================
   20년 시뮬레이션
========================================================= */

let timer=null;


function simulate(){

    if(timer)
        clearInterval(timer);


    let y=0;


    timer=setInterval(
        ()=>{

            y++;

            state.year=y;


            document.getElementById(
                "year"
            ).textContent=
                y+"년차";


            const [
                a,b,c,d,e,f
            ]=values();


            const strength=
                (a+b+c+d+e+f)/600;


            state.population=
                42+
                strength*18+
                y*strength*.35;


            state.companies=
                180+
                strength*220+
                y*strength*13;


            state.jobs=
                7+
                strength*4+
                y*strength*.15;


            state.commercial=
                Math.min(
                    100,
                    45+
                    strength*35+
                    y*strength*.7
                );


            state.cooperation=
                Math.min(
                    100,
                    40+
                    strength*35+
                    y*.8
                );


            state.settlement=
                Math.min(
                    100,
                    45+
                    strength*30+
                    y*.5
                );


            displayMetrics();


            if(y>=20){

                clearInterval(timer);

                /*
                   현재 임시 상생지수
                   → 나중에 실제 공식으로 교체
                */

                state.coexistenceIndex=
                    calculateCoexistenceIndex(state);


                toast(
                    "20년 시뮬레이션 완료 · 상생지수 "+
                    state.coexistenceIndex.toFixed(1)
                );
            }

        },
        180
    );
}


/* =========================================================
   미래 상생지수
========================================================= */

function calculateCoexistenceIndex(s){

    const score=

        s.commercial*.20+
        s.cooperation*.30+
        s.settlement*.20+
        Math.min(100,s.companies/6)*.15+
        Math.min(100,s.jobs*5)*.15;


    return Math.max(
        0,
        Math.min(
            100,
            score
        )
    );
}

/* =========================================================
   마우스 / 터치 카메라
========================================================= */

let dragging=false;
let lastX=0;
let lastY=0;


canvas.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        lastX=e.clientX;
        lastY=e.clientY;
    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx=e.clientX-lastX;
        const dy=e.clientY-lastY;


        lastX=e.clientX;
        lastY=e.clientY;


        if(mode==="overview"){

            camera.yaw+=dx*.005;

            camera.pitch+=dy*.004;

            camera.pitch=
                Math.max(
                    .25,
                    Math.min(
                        1.05,
                        camera.pitch
                    )
                );

        }else{

            camera.yaw+=dx*.006;

            camera.pitch+=dy*.003;

            camera.pitch=
                Math.max(
                    -.35,
                    Math.min(
                        .35,
                        camera.pitch
                    )
                );
        }
    }
);


canvas.addEventListener(
    "pointerup",
    ()=>{
        dragging=false;
    }
);


canvas.addEventListener(
    "pointercancel",
    ()=>{
        dragging=false;
    }
);


/* =========================================================
   휠 / 핀치에 가까운 확대
========================================================= */

canvas.addEventListener(
    "wheel",
    e=>{

        e.preventDefault();

        if(mode==="overview"){

            camera.zoom+=
                -e.deltaY*.001;

            camera.zoom=
                Math.max(
                    .55,
                    Math.min(
                        1.8,
                        camera.zoom
                    )
                );
        }
    },
    {passive:false}
);


/* =========================================================
   건물 선택
========================================================= */

canvas.addEventListener(
    "dblclick",
    e=>{

        if(mode!=="overview")
            return;


        let selected=null;
        let best=Infinity;


        for(const b of buildings){

            const p=
                project(
                    b.x,
                    b.h*.5,
                    b.z
                );


            const dist=
                Math.hypot(
                    e.clientX-p.x,
                    e.clientY-p.y
                );


            if(
                dist<best &&
                dist<80
            ){

                best=dist;
                selected=b;
            }
        }


        if(selected)
            showInfo(selected);
    }
);

/* =========================================================
   조이스틱
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );


let jx=0;
let jy=0;
let active=false;


joystick.addEventListener(
    "pointerdown",
    e=>{

        active=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickMove(e);
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(active)
            joystickMove(e);
    }
);


joystick.addEventListener(
    "pointerup",
    joystickReset
);


joystick.addEventListener(
    "pointercancel",
    joystickReset
);


function joystickMove(e){

    const r=
        joystick.getBoundingClientRect();


    let x=
        e.clientX-
        (
            r.left+
            r.width/2
        );


    let y=
        e.clientY-
        (
            r.top+
            r.height/2
        );


    const max=38;

    const len=Math.hypot(x,y);


    if(len>max){

        x=x/len*max;
        y=y/len*max;
    }


    jx=x/max;
    jy=y/max;


    stick.style.left=
        35+x+"px";

    stick.style.top=
        35+y+"px";
}


function joystickReset(){

    active=false;

    jx=0;
    jy=0;

    stick.style.left="35px";
    stick.style.top="35px";
}


/* =========================================================
   이동
========================================================= */

setInterval(
    ()=>{

        if(mode!=="walk")
            return;


        const speed=1.8;


        /*
           카메라가 바라보는 방향 기준 이동
        */

        camera.x+=
            Math.sin(camera.yaw)*
            (-jy)*
            speed;

        camera.z+=
            Math.cos(camera.yaw)*
            (-jy)*
            speed;


        camera.x+=
            Math.cos(camera.yaw)*
            jx*
            speed;

        camera.z+=
            -Math.sin(camera.yaw)*
            jx*
            speed;


        camera.x=
            Math.max(
                -140,
                Math.min(
                    140,
                    camera.x
                )
            );


        camera.z=
            Math.max(
                -140,
                Math.min(
                    140,
                    camera.z
                )
            );

    },
    30
);
