<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>PUBLIC CITY TWIN</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#9caeb7;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
}

#renderCanvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

#topbar{
    position:fixed;
    z-index:20;
    top:12px;
    left:12px;
    right:12px;
    height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 16px;

    color:white;

    background:rgba(17,25,32,.88);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
}

.title{
    font-size:15px;
    font-weight:900;
}

.subtitle{
    margin-top:3px;
    font-size:9px;
    color:#aab7c0;
}

#mode{
    font-size:11px;
    font-weight:900;
    color:#65baf0;
}

.panel{
    position:fixed;
    z-index:20;

    color:white;

    background:rgba(17,25,32,.88);
    backdrop-filter:blur(15px);

    border:1px solid rgba(255,255,255,.14);
    border-radius:14px;

    box-shadow:0 12px 35px rgba(0,0,0,.2);
}

#policy{
    top:82px;
    left:12px;

    width:270px;
    max-height:calc(100% - 96px);

    overflow:auto;

    padding:14px;
}

.section{
    margin-bottom:14px;
}

.section-title{
    margin-bottom:9px;

    font-size:10px;
    font-weight:900;

    color:#aebbc5;
}

.slider{
    margin-bottom:10px;
}

.slider-row{
    display:flex;
    justify-content:space-between;

    font-size:10px;
}

.slider-row b{
    color:#61b8ef;
}

input[type=range]{
    width:100%;
    accent-color:#4ba8df;
}

button{
    width:100%;
    min-height:40px;

    margin:3px 0;

    border:0;
    border-radius:9px;

    color:white;

    background:#2d414f;

    font-weight:800;
}

button.primary{
    background:#287eae;
}

button.green{
    background:#197250;
}

button.orange{
    background:#815d2e;
}

#stats{
    position:fixed;
    z-index:20;

    right:12px;
    bottom:12px;

    width:280px;

    padding:13px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.stat{
    padding:8px;

    border-radius:9px;

    background:rgba(255,255,255,.055);
}

.stat small{
    display:block;

    color:#91a1ac;

    font-size:8px;
}

.stat strong{
    display:block;

    margin-top:2px;

    font-size:15px;
}

#viewButtons{
    position:fixed;
    z-index:25;

    left:50%;
    bottom:12px;

    transform:translateX(-50%);

    display:flex;
    gap:6px;

    width:250px;
}

#viewButtons button{
    margin:0;
}

#joystick{
    display:none;

    position:fixed;
    z-index:30;

    left:18px;
    bottom:25px;

    width:132px;
    height:132px;

    border-radius:50%;

    background:rgba(0,0,0,.25);

    border:2px solid rgba(255,255,255,.25);

    touch-action:none;
}

#stick{
    position:absolute;

    width:48px;
    height:48px;

    left:42px;
    top:42px;

    border-radius:50%;

    background:rgba(65,164,225,.9);
}

#buildingInfo{
    display:none;

    position:fixed;
    z-index:30;

    right:12px;
    top:82px;

    width:280px;

    padding:14px;

    color:white;

    background:rgba(17,25,32,.92);
    backdrop-filter:blur(15px);

    border-radius:14px;

    border:1px solid rgba(255,255,255,.15);
}

#buildingName{
    font-size:17px;
    font-weight:900;
}

#buildingType{
    margin-top:4px;

    color:#65baf0;

    font-size:10px;
    font-weight:800;
}

#buildingDescription{
    margin-top:9px;

    color:#c1ccd3;

    font-size:10px;
    line-height:1.6;
}

#toast{
    display:none;

    position:fixed;
    z-index:100;

    left:50%;
    top:80px;

    transform:translateX(-50%);

    padding:9px 14px;

    border-radius:9px;

    background:rgba(12,20,27,.95);

    color:white;

    font-size:11px;
    font-weight:800;
}

@media(max-width:700px){

    #policy{
        width:225px;
    }

    #stats{
        width:215px;
    }

    #buildingInfo{
        width:220px;
    }
}
</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<div id="topbar">

    <div>
        <div class="title">
            PUBLIC CITY TWIN
        </div>

        <div class="subtitle">
            2차 공공기관 이전 · 기능·산업 중심 도시 디지털 트윈
        </div>
    </div>

    <div id="mode">
        조감도
    </div>

</div>


<div id="policy" class="panel">

    <div class="section">

        <div class="section-title">
            도시 정책 변수
        </div>

        <div class="slider">

            <div class="slider-row">
                <span>공공기관 집적</span>
                <b id="v1">70</b>
            </div>

            <input id="s1"
                   type="range"
                   min="0"
                   max="100"
                   value="70">
        </div>


        <div class="slider">

            <div class="slider-row">
                <span>산업 연계성</span>
                <b id="v2">65</b>
            </div>

            <input id="s2"
                   type="range"
                   min="0"
                   max="100"
                   value="65">
        </div>


        <div class="slider">

            <div class="slider-row">
                <span>대학·연구</span>
                <b id="v3">55</b>
            </div>

            <input id="s3"
                   type="range"
                   min="0"
                   max="100"
                   value="55">
        </div>


        <div class="slider">

            <div class="slider-row">
                <span>정주 환경</span>
                <b id="v4">60</b>
            </div>

            <input id="s4"
                   type="range"
                   min="0"
                   max="100"
                   value="60">
        </div>


        <div class="slider">

            <div class="slider-row">
                <span>교통 접근성</span>
                <b id="v5">60</b>
            </div>

            <input id="s5"
                   type="range"
                   min="0"
                   max="100"
                   value="60">
        </div>


        <div class="slider">

            <div class="slider-row">
                <span>초기 기업 기반</span>
                <b id="v6">35</b>
            </div>

            <input id="s6"
                   type="range"
                   min="0"
                   max="100"
                   value="35">
        </div>

    </div>


    <div class="section">

        <div class="section-title">
            도시 전략
        </div>

        <button onclick="applyPreset(75,70,65,75,70,50)">
            균형형
        </button>

        <button onclick="applyPreset(80,95,75,55,65,80)">
            산업 클러스터형
        </button>

        <button onclick="applyPreset(65,55,60,95,75,40)">
            정주 우선형
        </button>

        <button onclick="applyPreset(70,65,60,70,98,45)">
            교통 거점형
        </button>

    </div>


    <div class="section">

        <div class="section-title">
            시뮬레이션
        </div>

        <button
            class="green"
            onclick="runSimulation()">
            ▶ 20년 도시 시뮬레이션
        </button>

        <button
            class="orange"
            onclick="resetCity()">
            ↻ 초기화
        </button>

    </div>

</div>


<div id="buildingInfo">

    <div id="buildingName"></div>

    <div id="buildingType"></div>

    <div id="buildingDescription"></div>

</div>


<div id="stats" class="panel">

    <div class="section-title">
        도시 성과
    </div>

    <div class="grid">

        <div class="stat">
            <small>정주인구</small>
            <strong id="population">52.0만</strong>
        </div>

        <div class="stat">
            <small>연계기업</small>
            <strong id="companies">350</strong>
        </div>

        <div class="stat">
            <small>일자리</small>
            <strong id="jobs">12.4만</strong>
        </div>

        <div class="stat">
            <small>상권활성도</small>
            <strong id="commercial">63%</strong>
        </div>

        <div class="stat">
            <small>산학협력</small>
            <strong id="cooperation">48%</strong>
        </div>

        <div class="stat">
            <small>정착률</small>
            <strong id="settlement">61%</strong>
        </div>

        <div class="stat">
            <small>상생지수</small>
            <strong id="coexistence">—</strong>
        </div>

        <div class="stat">
            <small>시뮬레이션</small>
            <strong id="year">0년</strong>
        </div>

    </div>

</div>


<div id="viewButtons">

    <button onclick="setOverview()">
        🛰️ 조감도
    </button>

    <button
        class="primary"
        onclick="setWalk()">
        🚶 도시 진입
    </button>

</div>


<div id="joystick">

    <div id="stick"></div>

</div>


<div id="toast"></div>


<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

/* =========================================================
   ENGINE
========================================================= */

const canvas =
    document.getElementById("renderCanvas");

const engine =
    new BABYLON.Engine(
        canvas,
        true,
        {
            antialias:true,
            adaptToDeviceRatio:true
        }
    );

const scene =
    new BABYLON.Scene(engine);

scene.clearColor =
    new BABYLON.Color4(
        .60,
        .71,
        .78,
        1
    );


/* =========================================================
   LIGHTING
========================================================= */

const sun =
    new BABYLON.DirectionalLight(
        "sun",
        new BABYLON.Vector3(
            -.45,
            -1,
            -.35
        ),
        scene
    );

sun.position =
    new BABYLON.Vector3(
        250,
        300,
        180
    );

sun.intensity=2.0;


const skyLight =
    new BABYLON.HemisphericLight(
        "skyLight",
        new BABYLON.Vector3(
            0,
            1,
            0
        ),
        scene
    );

skyLight.intensity=.75;


/* =========================================================
   SHADOW
========================================================= */

const shadowGenerator =
    new BABYLON.ShadowGenerator(
        2048,
        sun
    );

shadowGenerator.useBlurExponentialShadowMap=true;

shadowGenerator.blurKernel=24;


/* =========================================================
   MATERIAL
========================================================= */

function material(
    name,
    color,
    roughness=.75,
    metallic=0
){

    const m =
        new BABYLON.PBRMaterial(
            name,
            scene
        );

    m.albedoColor =
        BABYLON.Color3.FromHexString(
            color
        );

    m.roughness=roughness;

    m.metallic=metallic;

    return m;
}


const MAT={

    asphalt:
        material(
            "asphalt",
            "#34383B",
            .95
        ),

    sidewalk:
        material(
            "sidewalk",
            "#9B9D9B",
            .9
        ),

    grass:
        material(
            "grass",
            "#55794E",
            1
        ),

    soil:
        material(
            "soil",
            "#756148",
            1
        ),

    public:
        material(
            "public",
            "#687D8D",
            .48
        ),

    office:
        material(
            "office",
            "#737D82",
            .5
        ),

    glass:
        material(
            "glass",
            "#4E819C",
            .08
        ),

    old:
        material(
            "old",
            "#88776A",
            .85
        ),

    brick:
        material(
            "brick",
            "#835C4E",
            .9
        ),

    residential:
        material(
            "residential",
            "#A2A7A5",
            .78
        ),

    commercial:
        material(
            "commercial",
            "#A17D5C",
            .65
        ),

    industrial:
        material(
            "industrial",
            "#6D7475",
            .9
        ),

    roof:
        material(
            "roof",
            "#292D2F",
            .9
        ),

    tree:
        material(
            "tree",
            "#3D6840",
            1
        ),

    trunk:
        material(
            "trunk",
            "#61452F",
            1
        ),

    white:
        material(
            "white",
            "#E2E1DD",
            .72
        ),

    yellow:
        material(
            "yellow",
            "#D1B64D",
            .6
        )
};


/* =========================================================
   CITY STORAGE
========================================================= */

const buildings=[];

const cityObjects=[];


/* =========================================================
   REGISTER OBJECT
========================================================= */

function registerCityObject(mesh){

    cityObjects.push(mesh);

    return mesh;
}


/* =========================================================
   CLEAR CITY
========================================================= */

function clearCity(){

    buildings.length=0;

    cityObjects.forEach(
        mesh=>{

            if(
                mesh &&
                !mesh.isDisposed()
            ){
                mesh.dispose();
            }

        }
    );

    cityObjects.length=0;
}


/* =========================================================
   BUILDING
========================================================= */

function createBuilding(
    x,
    z,
    width,
    depth,
    height,
    type,
    name
){

    const body =
        BABYLON.MeshBuilder.CreateBox(
            name,
            {
                width,
                depth,
                height
            },
            scene
        );

    body.position.set(
        x,
        height/2,
        z
    );

    body.material =
        MAT[type] ||
        MAT.office;


    registerCityObject(body);

    shadowGenerator
        .addShadowCaster(body);


    buildings.push({

        mesh:body,

        x,
        z,

        width,
        depth,
        height,

        type,
        name

    });


    /* =====================
       ROOF
    ===================== */

    const roof =
        BABYLON.MeshBuilder.CreateBox(
            "roof",
            {
                width:width+1,
                depth:depth+1,
                height:.35
            },
            scene
        );

    roof.position.set(
        x,
        height+.17,
        z
    );

    roof.material=MAT.roof;

    registerCityObject(roof);


    /* =====================
       WINDOWS
    ===================== */

    if(
        width>10 &&
        depth>10
    ){

        const floors=
            Math.max(
                1,
                Math.floor(
                    height/4
                )
            );

        const cols=
            Math.max(
                2,
                Math.floor(
                    width/4
                )
            );


        for(
            let f=0;
            f<floors;
            f++
        ){

            const y=
                2+
                f*
                (
                    (height-4)/
                    Math.max(
                        1,
                        floors-1
                    )
                );


            for(
                let c=0;
                c<cols;
                c++
            ){

                const wx=
                    x-width/2+2+
                    c*
                    (
                        (width-4)/
                        Math.max(
                            1,
                            cols-1
                        )
                    );


                const window =
                    BABYLON.MeshBuilder.CreateBox(
                        "window",
                        {
                            width:1.25,
                            height:1.45,
                            depth:.06
                        },
                        scene
                    );

                window.position.set(
                    wx,
                    y,
                    z-depth/2-.04
                );

                window.material=
                    MAT.glass;

                registerCityObject(window);
            }
        }
    }


    return body;
}


/* =========================================================
   ROAD NETWORK
========================================================= */

function generateRoadNetwork(){

    const [
        institution,
        industry,
        research,
        settlement,
        transport,
        firms
    ]=getValues();


    /*
       교통 접근성이 높을수록
       도로 간격이 좁아진다.
    */

    const spacing =
        72-
        transport*.34;


    const roadCount =
        Math.ceil(
            430/spacing
        );


    for(
        let i=-roadCount;
        i<=roadCount;
        i++
    ){

        const p=i*spacing;


        /* horizontal */

        const roadH =
            BABYLON.MeshBuilder.CreateBox(
                "dynamicRoadH",
                {
                    width:860,
                    depth:11,
                    height:.12
                },
                scene
            );

        roadH.position.set(
            0,
            .06,
            p
        );

        roadH.material=
            MAT.asphalt;

        registerCityObject(roadH);


        /* vertical */

        const roadV =
            BABYLON.MeshBuilder.CreateBox(
                "dynamicRoadV",
                {
                    width:11,
                    depth:860,
                    height:.12
                },
                scene
            );

        roadV.position.set(
            p,
            .06,
            0
        );

        roadV.material=
            MAT.asphalt;

        registerCityObject(roadV);


        /* sidewalks */

        const sw1 =
            BABYLON.MeshBuilder.CreateBox(
                "sidewalk",
                {
                    width:860,
                    depth:2,
                    height:.18
                },
                scene
            );

        sw1.position.set(
            0,
            .14,
            p-7
        );

        sw1.material=
            MAT.sidewalk;

        registerCityObject(sw1);


        const sw2 =
            BABYLON.MeshBuilder.CreateBox(
                "sidewalk",
                {
                    width:2,
                    depth:860,
                    height:.18
                },
                scene
            );

        sw2.position.set(
            p-7,
            .14,
            0
        );

        sw2.material=
            MAT.sidewalk;

        registerCityObject(sw2);
    }
}


/* =========================================================
   ROAD MARKING
========================================================= */

function generateRoadMarkings(){

    const [
        institution,
        industry,
        research,
        settlement,
        transport,
        firms
    ]=getValues();


    const spacing =
        72-
        transport*.34;


    const roadCount =
        Math.ceil(
            430/spacing
        );


    for(
        let i=-roadCount;
        i<=roadCount;
        i++
    ){

        const p=i*spacing;


        for(
            let x=-420;
            x<420;
            x+=14
        ){

            const mark =
                BABYLON.MeshBuilder.CreateBox(
                    "roadMark",
                    {
                        width:6,
                        depth:.18,
                        height:.035
                    },
                    scene
                );

            mark.position.set(
                x,
                .14,
                p
            );

            mark.material=
                MAT.white;

            registerCityObject(mark);
        }


        for(
            let z=-420;
            z<420;
            z+=14
        ){

            const mark =
                BABYLON.MeshBuilder.CreateBox(
                    "roadMark",
                    {
                        width:.18,
                        depth:6,
                        height:.035
                    },
                    scene
                );

            mark.position.set(
                p,
                .14,
                z
            );

            mark.material=
                MAT.white;

            registerCityObject(mark);
        }
    }
}


/* =========================================================
   RANDOM BUILDING HELPER
========================================================= */

function randomBuilding(
    x,
    z,
    type,
    name,
    minHeight,
    maxHeight
){

    const width=
        11+
        Math.random()*18;

    const depth=
        10+
        Math.random()*17;

    const height=
        minHeight+
        Math.random()*
        (
            maxHeight-
            minHeight
        );


    return createBuilding(
        x,
        z,
        width,
        depth,
        height,
        type,
        name
    );
}


/* =========================================================
   DOWNTOWN
========================================================= */

function generateDowntown(){

    const [
        institution,
        industry,
        research,
        settlement,
        transport,
        firms
    ]=getValues();


    const count=
        Math.round(
            20+
            institution*.15+
            firms*.20
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle=
            Math.random()*
            Math.PI*2;

        const radius=
            65+
            Math.random()*105;


        const x=
            Math.cos(angle)*
            radius;

        const z=
            Math.sin(angle)*
            radius;


        randomBuilding(
            x,
            z,
            "office",
            "도심 업무시설",
            30,
            105
        );
    }
}


/* =========================================================
   PUBLIC CLUSTER
========================================================= */

function generatePublicCluster(){

    const [
        institution,
        industry,
        research,
        settlement,
        transport,
        firms
    ]=getValues();


    const count=
        Math.max(
            2,
            Math.round(
                2+
                institution*.14
            )
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle=
            i/count*
            Math.PI*2;


        const radius=
            25+
            Math.random()*75;


        const x=
            Math.cos(angle)*
            radius;

        const z=
            Math.sin(angle)*
            radius;


        const height=
            30+
            institution*.45+
            Math.random()*35;


        createBuilding(
            x,
            z,
            22+
                Math.random()*22,
            18+
                Math.random()*15,
            height,
            "public",
            "공공기관 "+(i+1)
        );
    }
}


/* =========================================================
   RESEARCH
========================================================= */

function generateResearch(){

    const [
        institution,
        industry,
        research,
        settlement,
        transport,
        firms
    ]=getValues();


    const count=
        Math.round(
            4+
            research*.18
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const x=
            -230+
            Math.random()*120;

        const z=
            120+
            Math.random()*140;


        randomBuilding(
            x,
            z,
            "office",
            "대학·연구시설",
            14,
            42
        );
    }
}


/* =========================================================

/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


let joystickX=0;

let joystickY=0;

let joystickActive=false;


joystick.addEventListener(
    "pointerdown",
    e=>{

        joystickActive=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        moveJoystick(e);
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            joystickActive
        ){

            moveJoystick(e);

        }

    }
);


joystick.addEventListener(
    "pointerup",
    resetJoystick
);


joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


function moveJoystick(e){

    const rect=
        joystick.getBoundingClientRect();


    let x=
        e.clientX-
        (
            rect.left+
            rect.width/2
        );


    let y=
        e.clientY-
        (
            rect.top+
            rect.height/2
        );


    const max=38;


    const distance=
        Math.hypot(
            x,
            y
        );


    if(
        distance>max
    ){

        x=
            x/distance*
            max;

        y=
            y/distance*
            max;
    }


    joystickX=
        x/max;

    joystickY=
        y/max;


    stick.style.left=
        (42+x)+"px";

    stick.style.top=
        (42+y)+"px";
}


function resetJoystick(){

    joystickActive=false;

    joystickX=0;

    joystickY=0;

    stick.style.left="42px";

    stick.style.top="42px";
}


/* =========================================================
   JOYSTICK MOVEMENT
========================================================= */

scene.onBeforeRenderObservable.add(
    ()=>{

        if(
            scene.activeCamera !==
            walkCamera
        )
            return;


        const forward=
            new BABYLON.Vector3(
                Math.sin(
                    walkCamera.rotation.y
                ),
                0,
                Math.cos(
                    walkCamera.rotation.y
                )
            );


        const right=
            new BABYLON.Vector3(
                Math.cos(
                    walkCamera.rotation.y
                ),
                0,
                -Math.sin(
                    walkCamera.rotation.y
                )
            );


        /*
           위 = 전진
           아래 = 후진
        */

        const movement=
            forward.scale(
                -joystickY*.22
            );


        movement.addInPlace(
            right.scale(
                joystickX*.22
            )
        );


        walkCamera.position
            .addInPlace(
                movement
            );


        walkCamera.position.y=
            1.7;
    }
);


/* =========================================================
   BUILDING PICK
========================================================= */

scene.onPointerObservable.add(
    pointerInfo=>{

        if(
            pointerInfo.type !==
            BABYLON.PointerEventTypes
                .POINTERPICK
        )
            return;


        if(
            !pointerInfo.pickInfo.hit
        )
            return;


        const picked=
            pointerInfo
                .pickInfo
                .pickedMesh;


        const found=
            buildings.find(
                b=>
                    b.mesh===
                    picked
            );


        if(
            !found
        )
            return;


        showBuilding(found);
    }
);

/* =========================================================
   SIMULATION
========================================================= */

let simulationTimer=null;


function runSimulation(){

    if(simulationTimer){

        clearInterval(
            simulationTimer
        );

        simulationTimer=null;
    }


    /*
       시뮬레이션 시작 시
       현재 정책을 도시 초기조건으로 반영
    */

    rebuildCity();


    let year=0;


    metrics.year=0;

    metrics.coexistence=null;

    updateMetrics();


    simulationTimer=
        setInterval(
            ()=>{

                year++;

                metrics.year=
                    year;


                const [
                    a,
                    b,
                    c,
                    d,
                    e,
                    f
                ]=
                    getValues();


                /*
                   각 정책변수가
                   시간에 따라 누적되는 구조
                */

                const policyStrength=

                    a*.18+
                    b*.22+
                    c*.15+
                    d*.18+
                    e*.15+
                    f*.12;


                const growth=
                    policyStrength/100;


                /*
                   인구
                */

                metrics.population=
                    42+
                    growth*18+
                    year*
                    growth*.45;


                /*
                   기업
                */

                metrics.companies=
                    180+
                    growth*220+
                    year*
                    growth*14;


                /*
                   일자리
                */

                metrics.jobs=
                    7+
                    growth*4+
                    year*
                    growth*.18;


                /*
                   상권
                */

                metrics.commercial=
                    Math.min(
                        100,
                        45+
                        growth*35+
                        year*
                        growth*.8
                    );


                /*
                   산학협력
                */

                metrics.cooperation=
                    Math.min(
                        100,
                        40+
                        growth*35+
                        year*.9
                    );


                /*
                   정착률
                */

                metrics.settlement=
                    Math.min(
                        100,
                        45+
                        growth*30+
                        year*.55
                    );


                updateMetrics();


                /*
                   ★★★

                   매 5년마다
                   실제 도시 공간도
                   성장하도록 재구성

                */

                if(
                    year%5===0
                ){

                    rebuildSimulationCity(
                        year
                    );

                }


                /*
                   20년 완료
                */

                if(
                    year>=20
                ){

                    clearInterval(
                        simulationTimer
                    );

                    simulationTimer=null;


                    metrics.coexistence=
                        calculateCoexistenceIndex(
                            metrics
                        );


                    updateMetrics();


                    toast(
                        "20년 도시 시뮬레이션 완료"
                    );
                }

            },
            300
        );
}

    */

    const parkCount=
        Math.round(
            2+
            settlement/13+
            year/5
        );


    for(
        let i=0;
        i<parkCount;
        i++
    ){

        park(

            -180+
            Math.random()*360,

            -180+
            Math.random()*360,

            30+
            Math.random()*40,

            25+
            Math.random()*35
        );
    }
}


/* =========================================================
   COEXISTENCE INDEX
========================================================= */

function calculateCoexistenceIndex(
    m
){

    /*
       현재는 임시 계산식.

       나중에 사용자가 제시하는
       실제 상생지수 공식으로 교체한다.
    */

    const value=

        m.commercial*.20+

        m.cooperation*.30+

        m.settlement*.20+

        Math.min(
            100,
            m.companies/6
        )*.15+

        Math.min(
            100,
            m.jobs*5
        )*.15;


    return Math.max(
        0,
        Math.min(
            100,
            value
        )
    );
}


/* =========================================================
   RESET
========================================================= */

function resetCity(){

    if(simulationTimer){

        clearInterval(
            simulationTimer
        );

        simulationTimer=null;
    }


    applyPreset(
        70,
        65,
        55,
        60,
        60,
        35
    );


    metrics.year=0;

    metrics.coexistence=null;

    updateMetrics();


    rebuildCity();


    setOverview();
}


/* =========================================================
   TOAST
========================================================= */

function toast(
    text
){

    const el=
        document.getElementById(
            "toast"
        );


    el.textContent=text;

    el.style.display=
        "block";


    clearTimeout(
        el._timer
    );


    el._timer=
        setTimeout(
            ()=>{
                el.style.display=
                    "none";
            },
            1700
        );
}


/* =========================================================
   START
========================================================= */

rebuildCity();

calculateMetrics();

setOverview();


/* =========================================================
   RENDER
========================================================= */

engine.runRenderLoop(
    ()=>{
        scene.render();
    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{
        engine.resize();
    }
);
